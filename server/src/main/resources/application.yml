spring:
  application:
    name: ftth-server
  datasource:
    url: ${FTTH_DB_URL:jdbc:postgresql://localhost:5432/ftth}
    username: ${FTTH_DB_USER:ftth}
    password: ${FTTH_DB_PASSWORD:ftth}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    locations: classpath:db/migration
  mail:
    # SMTP milik PLATFORM (satu untuk semua tenant) — dipakai pesan transaksional yang tak
    # boleh bergantung pada gateway WA tenant, mis. kode pemulihan password portal.
    #
    # CADANGAN, bukan lagi satu-satunya sumber: sejak layar Setelan Email platform ada
    # (`/api/platform/email-settings`), baris di DB yang host-nya terisi MENANG atas blok
    # ini. Nilai di sini dipakai selama host di DB masih kosong — deploy lama karena itu
    # tetap berjalan tanpa disentuh. Dua-duanya kosong = email hanya dicatat ke log (aman
    # untuk dev; lihat SmtpSenderFactory & SmtpEmailDispatcher).
    host: ${FTTH_MAIL_HOST:}
    port: ${FTTH_MAIL_PORT:587}
    username: ${FTTH_MAIL_USERNAME:}
    password: ${FTTH_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${FTTH_MAIL_AUTH:true}
          starttls:
            enable: ${FTTH_MAIL_STARTTLS:true}
  task:
    scheduling:
      # Belasan pekerjaan latar berbagi kolam ini, dan bawaan Spring cuma SATU utas: satu
      # walk SNMP yang menggantung akan membekukan penagihan, provisioning RADIUS, sampai
      # alarm PPPoE sekaligus — tanpa satu baris galat pun, karena tak ada yang gagal, cuma
      # tak pernah dapat giliran. Empat utas memberi jalan memutar; pool Hikari (10) tetap
      # lega karena tak semua job menyentuh database bersamaan.
      pool:
        size: ${FTTH_SCHEDULER_POOL_SIZE:4}
      thread-name-prefix: ftth-sched-
  servlet:
    multipart:
      # Bukti foto lapangan; batas keras di sini, validasi lebih ketat di service.
      max-file-size: 20MB
      max-request-size: 25MB

server:
  port: 8080
  # Aplikasi selalu berada di belakang reverse proxy (Caddy di prod, Vite saat dev), jadi
  # `remoteAddr` mentah adalah IP proxy — sama untuk SEMUA orang. Rem laju per-IP yang
  # dibangun di atasnya akan salah total: satu penyerang bisa mengunci seluruh dunia, dan
  # sebaliknya batasnya tak pernah mengenai siapa pun secara pribadi. Strategi `framework`
  # membuat Spring membaca `X-Forwarded-For`/`Forwarded` (dipasang Caddy) sebagai sumber
  # kebenaran. Ini AMAN hanya selama server tak terekspos langsung ke internet — di stack
  # produksi kita port 8080 memang tak pernah dipublikasikan (lihat docker-compose.prod.yml).
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        # `prometheus` dibuka di lapis actuator, TAPI dijaga token statis di SecurityConfig
        # (chain terpisah). Tanpa FTTH_METRICS_TOKEN endpoint ini menolak semua orang —
        # daftar metrik memuat nama tenant & bentuk sistem yang tak perlu jadi konsumsi umum.
        include: health,info,prometheus

springdoc:
  swagger-ui:
    path: /swagger-ui

ftth:
  security:
    # DEV ONLY — wajib dioverride via env di production (min. 32 byte)
    jwt-secret: ${FTTH_JWT_SECRET:dev-only-secret-ftth-oss-change-me-in-production!}
    # DEV ONLY — wajib dioverride via env di production (min. 32 byte).
    # Mengganti nilai ini membuat kredensial SNMP yang tersimpan tidak terbaca.
    encryption-secret: ${FTTH_ENCRYPTION_SECRET:dev-only-encryption-key-ftth-change-me-too!}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  throttle:
    # Rem laju endpoint publik yang menerima rahasia (masuk, pemulihan akun, daftar mandiri).
    # Matikan HANYA untuk uji beban — lihat ThrottleProperties untuk alasan tiap angka.
    enabled: ${FTTH_THROTTLE_ENABLED:true}
    login-per-identity:
      limit: ${FTTH_THROTTLE_LOGIN_IDENTITY:8}
      window: 15m
    login-per-ip:
      # Longgar disengaja: satu kantor ISP kerap keluar lewat satu NAT.
      limit: ${FTTH_THROTTLE_LOGIN_IP:40}
      window: 15m
    recovery-per-ip:
      limit: ${FTTH_THROTTLE_RECOVERY_IP:10}
      window: 1h
    recovery-redeem-per-ip:
      limit: ${FTTH_THROTTLE_RECOVERY_REDEEM_IP:30}
      window: 1h
    signup-per-ip:
      limit: ${FTTH_THROTTLE_SIGNUP_IP:5}
      window: 6h
  observability:
    # Token statis untuk /actuator/prometheus (dikirim scraper sebagai `Authorization:
    # Bearer <token>` atau header `X-Metrics-Token`). Kosong = endpoint metrik tertutup.
    metrics-token: ${FTTH_METRICS_TOKEN:}
    # Ke mana peringatan "pekerjaan latar macet" dikirim. Kosong = hanya dicatat ke log.
    alert-email: ${FTTH_ALERT_EMAIL:}
  cors:
    allowed-origins: ${FTTH_CORS_ORIGINS:http://localhost:5173}
  mail:
    # Alamat pengirim CADANGAN, dipakai bila setelan email platform di DB belum mengisinya.
    # Kosong di dua-duanya = SMTP dianggap belum disetel dan email jatuh ke log — jadi ini
    # yang menghidupkan kanal email, bukan `spring.mail.host` semata.
    from: ${FTTH_MAIL_FROM:}
    from-name: ${FTTH_MAIL_FROM_NAME:NetOps Console}
    # URL absolut aplikasi untuk merangkai <img src> logo di badan email. Klien email tak
    # mengerti path relatif, jadi kosong = email tetap terkirim, hanya tanpa logo. Setelan
    # yang sama di layar platform menang atas nilai ini.
    public-base-url: ${FTTH_MAIL_PUBLIC_BASE_URL:}
  bootstrap:
    platform-admin-email: ${FTTH_PLATFORM_ADMIN_EMAIL:root@ftth.local}
    platform-admin-password: ${FTTH_PLATFORM_ADMIN_PASSWORD:rootadmin123}
    seed-demo-tenant: ${FTTH_SEED_DEMO:true}
  storage:
    # Object storage bukti pengerjaan (MinIO dev; ganti ke S3 asli via env di prod).
    endpoint: ${FTTH_S3_ENDPOINT:http://localhost:9000}
    region: ${FTTH_S3_REGION:us-east-1}
    bucket: ${FTTH_S3_BUCKET:ftth-evidence}
    access-key: ${FTTH_S3_ACCESS_KEY:ftth}
    secret-key: ${FTTH_S3_SECRET_KEY:ftthminio}
    path-style-access: ${FTTH_S3_PATH_STYLE:true}
  cpe:
    # Router/ONT pelanggan dikelola lewat GenieACS (TR-069). Satu instance ACS
    # melayani semua tenant; kredensial NBI global — WAJIB diisi via env di prod.
    genieacs:
      base-url: ${FTTH_CPE_GENIEACS_BASE_URL:http://localhost:7557}
      username: ${FTTH_CPE_GENIEACS_USERNAME:}
      password: ${FTTH_CPE_GENIEACS_PASSWORD:}
      # Batas baca khusus probe kesehatan — pendek, supaya kartu Health Check tak
      # menggantung halaman selama read-timeout biasa saat ACS mati.
      health-timeout: ${FTTH_CPE_GENIEACS_HEALTH_TIMEOUT:PT3S}
    # Setelan yang DIKETIK OPERATOR ke halaman ACS di ONT pelanggan — alamat CWMP publik
    # (yang dihubungi PERANGKAT), bukan NBI di atas. public-host kosong = konsol menandai
    # "belum dikonfigurasi" alih-alih memajang URL palsu.
    ont:
      public-host: ${FTTH_CPE_PUBLIC_HOST:}
      cwmp-port: ${FTTH_CPE_CWMP_PORT:7547}
      acs-username: ${FTTH_CPE_ONT_ACS_USERNAME:}
      acs-password: ${FTTH_CPE_ONT_ACS_PASSWORD:}
      connection-request-username: ${FTTH_CPE_ONT_CR_USERNAME:}
      connection-request-password: ${FTTH_CPE_ONT_CR_PASSWORD:}
      # Bawaan pabrik ONT umumnya 3600 detik — terlalu lama; 300 yang dipakai di sini.
      periodic-inform-interval: ${FTTH_CPE_ONT_INFORM_INTERVAL:PT300S}
    # Seberapa sering proyeksi CPE disinkronkan dari ACS.
    sync-interval: ${FTTH_CPE_SYNC_INTERVAL:PT5M}
    # ONU dianggap online bila inform terakhirnya dalam ambang ini.
    online-stale-after: ${FTTH_CPE_ONLINE_STALE_AFTER:PT15M}
    # Path parameter SUHU vendor (dipisah koma), mis.
    # InternetGatewayDevice.DeviceInfo.X_HW_Temperature. TR-069 tak membakukan suhu, jadi
    # KOSONG secara bawaan: kolom TEMP di konsol ACS akan "—" sampai path vendor diisi.
    temperature-params: ${FTTH_CPE_TEMPERATURE_PARAMS:}
    # "Segarkan Batch" itu SAPUAN BERPLAFON, bukan "semua". Tanpa infrastruktur async,
    # tiap klik menahan satu thread servlet + satu koneksi Hikari; plafon & anggaran waktu
    # inilah yang menjaga agar armada 3.000 ONT tak membekukan konsol belasan menit.
    bulk-refresh-max: ${FTTH_CPE_BULK_REFRESH_MAX:50}
    bulk-refresh-budget: ${FTTH_CPE_BULK_REFRESH_BUDGET:PT20S}
    # Berapa lama hasil probe kesehatan dipakai ulang. Teknisi memegang izin ini dan
    # halamannya menyegarkan diri sendiri; tanpa memoisasi, satu ruang kerja berisi
    # sepuluh tab menghujani NBI dengan probe yang jawabannya sudah pasti sama.
    health-probe-ttl: ${FTTH_CPE_HEALTH_PROBE_TTL:PT10S}
    diagnostics:
      # Berkas yang ditarik saat "Uji Kecepatan" (TR-143 DownloadDiagnostics).
      # Yang mengunduh PERANGKAT pelanggan, bukan server — jadi alamatnya harus
      # terjangkau dari sisi pelanggan, dan besarnya menentukan lama uji.
      # CATATAN: default lama speedtest.tele2.net sudah dimatikan Tele2; arahkan
      # ke berkas milikmu sendiri kalau fitur ini mau dipakai sungguhan.
      download-url: ${FTTH_CPE_DIAGNOSTICS_DOWNLOAD_URL:http://speedtest.tele2.net/10MB.zip}
  billing:
    billing-day-of-month: 1
    due-days: 7
    grace-days: 3
    auto-isolir: true
    number-prefix: INV
    default-provider: MANUAL
    scheduler-interval: PT12H
    # DEV ONLY — override via env di production
    webhook-secret: ${FTTH_BILLING_WEBHOOK_SECRET:dev-only-billing-webhook-secret-change-me}
    # Akun MASTER agregator (mode PLATFORM/xenPlatform). MATI secara default — semua tenant
    # mode PLATFORM dorman (jatuh ke fallback MANUAL) sampai kredensial master diisi via env.
    platform:
      enabled: ${FTTH_BILLING_PLATFORM_ENABLED:false}
      xendit:
        secret-key: ${FTTH_BILLING_PLATFORM_XENDIT_SECRET_KEY:}
        webhook-token: ${FTTH_BILLING_PLATFORM_XENDIT_WEBHOOK_TOKEN:}
        fee-rule-id: ${FTTH_BILLING_PLATFORM_XENDIT_FEE_RULE_ID:}
        callback-base-url: ${FTTH_BILLING_PLATFORM_XENDIT_CALLBACK_BASE_URL:}
    # Adapter Pivot (BYO). sandbox=true → base api-stg. redirect-base-url WAJIB bila ada
    # tenant memakai Pivot (mode REDIRECT butuh URL balik); kosong = charge Pivot gagal jelas.
    pivot:
      sandbox: ${FTTH_BILLING_PIVOT_SANDBOX:false}
      redirect-base-url: ${FTTH_BILLING_PIVOT_REDIRECT_BASE_URL:}
    # Adapter Paywuz (BYO). payment-method = kode metode wajib saat bikin transaksi
    # (mis. meta-method QRIS/VA dari daftar metode proyek tenant). Sandbox via prefiks key.
    paywuz:
      payment-method: ${FTTH_BILLING_PAYWUZ_PAYMENT_METHOD:QRIS}
      expiry-minutes: ${FTTH_BILLING_PAYWUZ_EXPIRY_MINUTES:1440}
  # Langganan SaaS: platform menagih tenant biaya bulanan memakai aplikasi. Gateway aktif &
  # kredensialnya disetel super-admin lewat UI (tabel platform, terenkripsi), bukan env di sini.
  # Interval scheduler mengatur penerbitan tagihan periodik + penegakan tunggakan (auto-suspend).
  platform-billing:
    scheduler-interval: ${FTTH_PLATFORM_BILLING_SCHEDULER_INTERVAL:PT12H}
  vpn:
    # Bawaan hub OpenVPN manajemen (dipakai saat pembuatan tanpa nilai eksplisit).
    default-port: 1194
    # TCP: satu-satunya protokol yang bisa di-dial klien OpenVPN RouterOS v6 (perangkat smips
    # seperti hAP lite tak akan pernah dapat v7). Buka port ini TCP di firewall/NSG VPS.
    default-protocol: TCP
    default-tunnel-cidr: 10.8.0.0/24
    # URL publik aplikasi yang di-embed ke installer (dipakai VPS untuk callback verify/connect).
    # Kosong = diturunkan dari request unduh installer. WAJIB diisi di prod bila di belakang proxy.
    public-base-url: ${FTTH_VPN_PUBLIC_BASE_URL:}
    # Rentang port publik TCP di hub yang di-DNAT ke Winbox (8291) tiap perangkat — satu port
    # unik per akun. Buka rentang ini di firewall VPS (mis. 20000-40000/tcp).
    remote-port-min: ${FTTH_VPN_REMOTE_PORT_MIN:20000}
    remote-port-max: ${FTTH_VPN_REMOTE_PORT_MAX:40000}
  radius:
    # radius-db platform (RADIUS-as-a-service) yang dipegang SERVER untuk menulis otorisasi
    # (radcheck/radusergroup/radgroupreply). KOSONG = provisioning server-side NONAKTIF —
    # aplikasi tetap boot (dev/test), aksi menumpuk PENDING sampai dikonfigurasi. WAJIB diisi
    # via env di prod; kredensial ini RAHASIA PLATFORM (bukan input tenant).
    url: ${FTTH_RADIUS_DB_URL:}
    username: ${FTTH_RADIUS_DB_USER:}
    password: ${FTTH_RADIUS_DB_PASSWORD:}
    # Sakelar eksplisit — matikan provisioning walau url terisi (mis. saat migrasi).
    enabled: ${FTTH_RADIUS_ENABLED:true}
    # Alamat publik FreeRADIUS pusat yang tenant arahkan router-nya (nilai address= di
    # /radius Mikrotik). KOSONG = UI menandai "belum dikonfigurasi". Isi IP/host publik VPS
    # di prod. Port default = standar RADIUS (auth 1812, acct 1813) + DAE/CoA (3799).
    public-host: ${FTTH_RADIUS_PUBLIC_HOST:}
    auth-port: ${FTTH_RADIUS_AUTH_PORT:1812}
    acct-port: ${FTTH_RADIUS_ACCT_PORT:1813}
    coa-port: ${FTTH_RADIUS_COA_PORT:3799}
    # Isolir = "halaman tagihan", bukan kabel dicabut. Pelanggan nunggak tetap boleh login,
    # cuma dipindah ke grup isolir: sisa kecepatan seadanya (harus cukup memuat halaman bayar,
    # jangan 0) + masuk address-list yang dipakai router melempar semua tujuan ke halaman itu.
    # Nama address-list WAJIB sama dengan yang ada di aturan firewall router tenant.
    isolir-rate-limit: ${FTTH_RADIUS_ISOLIR_RATE_LIMIT:1M/1M}
    isolir-address-list: ${FTTH_RADIUS_ISOLIR_ADDRESS_LIST:isolir}
    # Selang worker mengklaim aksi provisioning tertunda.
    dispatch-interval: ${FTTH_RADIUS_DISPATCH_INTERVAL:PT10S}
    # Selang poller membaca sesi hidup radacct platform per tenant (jalur-baca server-side).
    session-poll-interval: ${FTTH_RADIUS_SESSION_POLL_INTERVAL:PT30S}
    # Umur maksimal `acctupdatetime` sebelum baris radacct yang masih menganga dianggap bangkai
    # (BRAS kehilangan jalur ke RADIUS → Acct-Stop tak pernah terkirim). Hanya berlaku untuk
    # baris yang memang pernah di-interim-update; WAJIB lebih longgar dari `interim-update`
    # router (kami menganjurkan 5m) — salah-offline lebih mahal daripada telat-offline.
    acct-interim-stale-after: ${FTTH_RADIUS_ACCT_INTERIM_STALE_AFTER:PT1H}
  bng:
    # Umur maksimal baris sesi sebelum dianggap putus. Sesi yang berakhir LENYAP dari radacct
    # (bukan jadi baris "offline"); poller menandainya putus tiap putaran, dan ambang ini
    # jaring pengaman bila poller-nya sendiri yang mati — tanpa itu seluruh pelanggan membeku
    # "Online". Beri kelonggaran beberapa kali `session-poll-interval` supaya satu poll yang
    # terlewat tak langsung memerahkan pelanggan; naikkan bila BRAS-nya lambat melapor.
    session-stale-after: ${FTTH_BNG_SESSION_STALE_AFTER:PT3M}
