spring:
  application:
    name: ftth-server
  datasource:
    url: ${FTTH_DB_URL:jdbc:postgresql://localhost:5432/ftth}
    username: ${FTTH_DB_USER:ftth}
    password: ${FTTH_DB_PASSWORD:ftth}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      # Bukti foto lapangan; batas keras di sini, validasi lebih ketat di service.
      max-file-size: 20MB
      max-request-size: 25MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui

ftth:
  security:
    # DEV ONLY — wajib dioverride via env di production (min. 32 byte)
    jwt-secret: ${FTTH_JWT_SECRET:dev-only-secret-ftth-oss-change-me-in-production!}
    # DEV ONLY — wajib dioverride via env di production (min. 32 byte).
    # Mengganti nilai ini membuat kredensial SNMP yang tersimpan tidak terbaca.
    encryption-secret: ${FTTH_ENCRYPTION_SECRET:dev-only-encryption-key-ftth-change-me-too!}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  cors:
    allowed-origins: ${FTTH_CORS_ORIGINS:http://localhost:5173}
  bootstrap:
    platform-admin-email: ${FTTH_PLATFORM_ADMIN_EMAIL:root@ftth.local}
    platform-admin-password: ${FTTH_PLATFORM_ADMIN_PASSWORD:rootadmin123}
    seed-demo-tenant: ${FTTH_SEED_DEMO:true}
  storage:
    # Object storage bukti pengerjaan (MinIO dev; ganti ke S3 asli via env di prod).
    endpoint: ${FTTH_S3_ENDPOINT:http://localhost:9000}
    region: ${FTTH_S3_REGION:us-east-1}
    bucket: ${FTTH_S3_BUCKET:ftth-evidence}
    access-key: ${FTTH_S3_ACCESS_KEY:ftth}
    secret-key: ${FTTH_S3_SECRET_KEY:ftthminio}
    path-style-access: ${FTTH_S3_PATH_STYLE:true}
  cpe:
    # Router/ONT pelanggan dikelola lewat GenieACS (TR-069). Satu instance ACS
    # melayani semua tenant; kredensial NBI global — WAJIB diisi via env di prod.
    genieacs:
      base-url: ${FTTH_CPE_GENIEACS_BASE_URL:http://localhost:7557}
      username: ${FTTH_CPE_GENIEACS_USERNAME:}
      password: ${FTTH_CPE_GENIEACS_PASSWORD:}
    # Seberapa sering proyeksi CPE disinkronkan dari ACS.
    sync-interval: ${FTTH_CPE_SYNC_INTERVAL:PT5M}
    # ONU dianggap online bila inform terakhirnya dalam ambang ini.
    online-stale-after: ${FTTH_CPE_ONLINE_STALE_AFTER:PT15M}
  billing:
    billing-day-of-month: 1
    due-days: 7
    grace-days: 3
    auto-isolir: true
    number-prefix: INV
    default-provider: MANUAL
    scheduler-interval: PT12H
    # DEV ONLY — override via env di production
    webhook-secret: ${FTTH_BILLING_WEBHOOK_SECRET:dev-only-billing-webhook-secret-change-me}
