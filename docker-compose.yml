# Infra dev untuk ftth OSS.
# timescaledb-ha sudah include PostGIS + TimescaleDB (dipakai mulai Phase 1/2,
# tapi dari awal image-nya disamakan biar gak ada kejutan).
services:
  postgres:
    image: timescale/timescaledb-ha:pg17
    environment:
      POSTGRES_DB: ftth
      POSTGRES_USER: ftth
      POSTGRES_PASSWORD: ftth
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ftth"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Object storage S3-compatible untuk bukti pengerjaan work order (Phase 4.2).
  # Konsol web di :9001, API S3 di :9000. Bucket dibuat otomatis oleh server saat start.
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ftth
      # Password root MinIO wajib ≥ 8 karakter.
      MINIO_ROOT_PASSWORD: ftthminio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # --- GenieACS (TR-069) untuk modul CPE — DEV, OPSIONAL ---
  # Semua service di bawah memakai profile "genieacs" agar TIDAK ikut naik pada
  # `docker compose up` biasa. Nyalakan seluruh stack (+ 1 device palsu) dengan:
  #     docker compose --profile genieacs up -d --build
  # Aplikasi terhubung ke NBI di http://localhost:7557 (default ftth.cpe.genieacs.base-url).
  genieacs-mongo:
    image: mongo:4.4
    profiles: ["genieacs"]
    volumes:
      - genieacs_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  genieacs-cwmp:
    build: ./docker/genieacs
    image: ftth/genieacs:1.2.16
    profiles: ["genieacs"]
    command: genieacs-cwmp
    environment:
      GENIEACS_MONGODB_CONNECTION_URL: mongodb://genieacs-mongo:27017/genieacs
    depends_on:
      genieacs-mongo:
        condition: service_healthy
    ports:
      - "7547:7547"
    restart: unless-stopped

  genieacs-nbi:
    build: ./docker/genieacs
    image: ftth/genieacs:1.2.16
    profiles: ["genieacs"]
    command: genieacs-nbi
    environment:
      GENIEACS_MONGODB_CONNECTION_URL: mongodb://genieacs-mongo:27017/genieacs
    depends_on:
      genieacs-mongo:
        condition: service_healthy
    ports:
      - "7557:7557"
    restart: unless-stopped

  # Device ONT palsu. Muncul di GenieACS dengan serial "000000"; daftarkan ONU
  # pelanggan dengan serial itu agar tertaut. Matikan bila tak perlu:
  #     docker compose stop genieacs-sim
  genieacs-sim:
    build: ./docker/genieacs-sim
    image: ftth/genieacs-sim:local
    profiles: ["genieacs"]
    command: ["-u", "http://genieacs-cwmp:7547/"]
    depends_on:
      genieacs-cwmp:
        condition: service_started
    restart: unless-stopped

  # --- FreeRADIUS + Postgres lab untuk modul BNG (BRAS/RADIUS) — DEV, OPSIONAL ---
  # Semua service di bawah memakai profile "radius" agar TIDAK ikut naik pada
  # `docker compose up` biasa. Nyalakan stack lab dengan:
  #     docker compose --profile radius up -d
  # Lihat docs/lab-bras-radius.md untuk cara mendaftarkan BRAS di app + uji end-to-end.
  #
  # radius-db menyimpan skema FreeRADIUS (radacct dkk). Adapter FreeRADIUS collector
  # membaca sesi hidup lewat JDBC ke basis data ini. Port host 5433 dipakai agar tak
  # bentrok dengan Postgres app di 5432.
  radius-db:
    image: postgres:16-alpine
    profiles: ["radius"]
    environment:
      POSTGRES_DB: radius
      POSTGRES_USER: radius
      POSTGRES_PASSWORD: radius
    ports:
      - "5433:5432"
    volumes:
      - radius_db:/var/lib/postgresql/data
      # Skema + data contoh dijalankan otomatis saat volume pertama kali dibuat.
      - ./docker/radius/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radius"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Server FreeRADIUS sungguhan — hanya diperlukan bila ingin BRAS (mis. Mikrotik CHR)
  # AUTENTIKASI ke RADIUS ini. Untuk sekadar menguji jalur BACA adapter, cukup radius-db.
  # Mendengarkan auth 1812/udp, accounting 1813/udp; DAE (CoA/Disconnect) 3799/udp
  # dikirim collector ke perangkat BRAS, bukan ke server ini.
  freeradius:
    image: freeradius/freeradius-server:3.2.5
    profiles: ["radius"]
    depends_on:
      radius-db:
        condition: service_healthy
    volumes:
      - ./docker/radius/freeradius/mods-enabled/sql:/etc/freeradius/mods-enabled/sql:ro
      - ./docker/radius/freeradius/clients.conf:/etc/freeradius/clients.conf:ro
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    # -X = mode debug verbose; enak untuk lab agar tiap paket auth terlihat di log.
    command: ["radiusd", "-X"]
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  genieacs_mongo:
  radius_db:
