name: ftth-network

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

x-genieacs: &genieacs
  image: ${GENIEACS_IMAGE:?set the released GenieACS image}
  restart: unless-stopped
  init: true
  mem_limit: 192m
  memswap_limit: 256m
  pids_limit: 128
  logging: *logging
  depends_on:
    mongo:
      condition: service_healthy

services:
  radius-db:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ['postgres', '-c', 'shared_buffers=32MB', '-c', 'max_connections=30']
    mem_limit: 192m
    memswap_limit: 256m
    logging: *logging
    environment:
      POSTGRES_DB: radius
      POSTGRES_USER: radius
      POSTGRES_PASSWORD: ${RADIUS_DB_PASSWORD:?set a database password}
    volumes:
      - radius_data:/var/lib/postgresql/data
      - ./radius/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - '${PRIVATE_ADDRESS:?set the WireGuard address}:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U radius -d radius']
      interval: 10s
      timeout: 5s
      retries: 12

  radius:
    image: freeradius/freeradius-server:3.2.5
    restart: unless-stopped
    # Keep NAS source addresses and apply the host firewall to RADIUS traffic.
    network_mode: host
    command: ['radiusd', '-f', '-l', 'stdout']
    mem_limit: 96m
    memswap_limit: 128m
    logging: *logging
    depends_on:
      radius-db:
        condition: service_healthy
    environment:
      RADIUS_DB_HOST: ${PRIVATE_ADDRESS:?set the WireGuard address}
      RADIUS_DB_PORT: '5432'
      RADIUS_DB_NAME: radius
      RADIUS_DB_USER: radius
      RADIUS_DB_PASSWORD: ${RADIUS_DB_PASSWORD:?set a database password}
    volumes:
      - ./radius/freeradius/mods-enabled/sql:/etc/freeradius/mods-enabled/sql:ro
      - ./radius/freeradius/clients.conf:/etc/freeradius/clients.conf:ro

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    command: ['mongod', '--wiredTigerCacheSizeGB', '0.25', '--bind_ip_all']
    mem_limit: 512m
    memswap_limit: 768m
    pids_limit: 256
    logging: *logging
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 30s

  cwmp:
    <<: *genieacs
    command: genieacs-cwmp
    environment:
      NODE_OPTIONS: --max-old-space-size=96
      GENIEACS_CWMP_WORKER_PROCESSES: '1'
      # Trust only the local nginx connection, including Docker's IPv4-mapped address.
      GENIEACS_FORWARDED_HEADER: '172.30.67.1,::ffff:172.30.67.1'
      GENIEACS_MONGODB_CONNECTION_URL: mongodb://mongo:27017/genieacs
      GENIEACS_FS_HOSTNAME: ${ACS_DEVICE_HOST:?set the device hostname}
      GENIEACS_FS_PORT: '7567'
      FTTH_CPE_CWMP_AUTH_MODE: ${FTTH_CPE_CWMP_AUTH_MODE:-enforce}
      FTTH_CPE_ONT_ACS_USERNAME: ${FTTH_CPE_ONT_ACS_USERNAME:?set the ONT username}
      FTTH_CPE_ONT_ACS_PASSWORD: ${FTTH_CPE_ONT_ACS_PASSWORD:?set the ONT password}
    ports:
      - '127.0.0.1:17547:7547'
      # Digest authentication requires the original TCP connection. Keep plain
      # CWMP direct; an HTTP reverse proxy cannot preserve that association.
      - '7547:7547'

  nbi:
    <<: *genieacs
    command: genieacs-nbi
    environment:
      NODE_OPTIONS: --max-old-space-size=96
      GENIEACS_NBI_WORKER_PROCESSES: '1'
      GENIEACS_MONGODB_CONNECTION_URL: mongodb://mongo:27017/genieacs
    ports:
      - '${PRIVATE_ADDRESS:?set the WireGuard address}:7557:7557'

  fs:
    <<: *genieacs
    command: genieacs-fs
    environment:
      NODE_OPTIONS: --max-old-space-size=96
      GENIEACS_FS_WORKER_PROCESSES: '1'
      GENIEACS_MONGODB_CONNECTION_URL: mongodb://mongo:27017/genieacs
    ports:
      - '127.0.0.1:17567:7567'

volumes:
  radius_data:
  mongo_data:

networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.30.67.0/24}
