# Daftar klien RADIUS (BRAS). Diisi dari `.env` lewat $ENV{...} — tak ada secret
# tertulis di file. `secret` HARUS sama dengan yang di `/radius` pada Mikrotik.
#
# Punya lebih dari satu Mikrotik? Salin blok di bawah (ganti nama & pakai variabel
# .env sendiri), atau pakai subnet di RADIUS_CLIENT_IP (mis. 10.0.0.0/24).

client mikrotik {
    ipaddr    = $ENV{RADIUS_CLIENT_IP}
    secret    = $ENV{RADIUS_CLIENT_SECRET}
    shortname = $ENV{RADIUS_CLIENT_NAME}
    nas_type  = other
}
