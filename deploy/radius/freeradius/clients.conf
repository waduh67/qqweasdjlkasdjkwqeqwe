# Daftar klien RADIUS (BRAS) PRODUKSI dibaca dari tabel `nas` (read_clients=yes di
# modul sql), BUKAN dari file ini. Tenant mendaftarkan BRAS-nya sendiri di UI aplikasi
# → server menulis baris `nas` (nasname=IP, secret, shortname=kode tenant) → FreeRADIUS
# memuatnya dari SQL. Tak ada shared secret tenant yang ditulis di file ini.
#
# Blok localhost di bawah HANYA untuk perkakas lokal di dalam container (mis. `radclient`
# uji cepat lewat loopback) — tak terekspos ke luar, jadi secret tetapnya aman. JANGAN
# menambah client BRAS tenant di sini; pakai UI.

client localhost {
    ipaddr    = 127.0.0.1
    secret    = radclient-loopback-only
    shortname = localhost
}
