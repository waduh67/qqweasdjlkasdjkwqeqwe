# ============================================================================
# Stack PRODUKSI ftth (dijalankan di VPS). Semua nilai sensitif diambil dari
# file `.env` di folder yang sama — TIDAK ada secret di file ini.
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Yang membuka port ke luar hanya: caddy (80/443), freeradius (1812/1813 udp),
# dan genieacs cwmp/fs (7547/7567) — ketiganya memang DIHUBUNGI dari luar. Postgres,
# MinIO, server, web, dan genieacs-nbi hanya hidup di dalam jaringan compose.
# ============================================================================
name: ftth

services:
  # --- Database: satu image sudah include PostGIS + TimescaleDB ---
  postgres:
    image: timescale/timescaledb-ha:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD}
      # Dipakai skrip init untuk membuat role & database aplikasi non-superuser.
      FTTH_DB_USER: ${FTTH_DB_USER}
      FTTH_DB_PASSWORD: ${FTTH_DB_PASSWORD}
      FTTH_DB_NAME: ${FTTH_DB_NAME}
    volumes:
      - pgdata:/home/postgres/pgdata/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 12

  # --- DB RADIUS: skema FreeRADIUS 3.x (radacct/radcheck/radusergroup/...) ---
  # Postgres terpisah dari DB aplikasi supaya skema RADIUS tak nyampur RLS/timescale.
  radius-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${RADIUS_DB_NAME:-radius}
      POSTGRES_USER: ${RADIUS_DB_USER:-radius}
      POSTGRES_PASSWORD: ${RADIUS_DB_PASSWORD:?wajib diisi di .env}
    volumes:
      - radiusdata:/var/lib/postgresql/data
      - ./radius/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RADIUS_DB_USER:-radius}"]
      interval: 10s
      timeout: 5s
      retries: 12

  # --- Server FreeRADIUS: auth PPPoE + accounting ke radius-db ---
  # Mikrotik menembak ke sini (auth 1812/udp, acct 1813/udp). Klien BRAS dibaca dari
  # tabel `nas` (read_clients=yes) — tenant daftarkan sendiri lewat UI, bukan .env.
  # CoA/Disconnect (RFC 5176 :3799) ditembak SERVER langsung ke alamat manajemen BRAS
  # (jalur DIRECT/overlay), bukan lagi dari collector maupun dari container ini.
  freeradius:
    image: freeradius/freeradius-server:3.2.5
    restart: unless-stopped
    depends_on:
      radius-db:
        condition: service_healthy
    environment:
      RADIUS_DB_HOST: radius-db
      RADIUS_DB_PORT: "5432"
      RADIUS_DB_NAME: ${RADIUS_DB_NAME:-radius}
      RADIUS_DB_USER: ${RADIUS_DB_USER:-radius}
      RADIUS_DB_PASSWORD: ${RADIUS_DB_PASSWORD:?wajib diisi di .env}
    volumes:
      - ./radius/freeradius/mods-enabled/sql:/etc/freeradius/mods-enabled/sql:ro
      - ./radius/freeradius/clients.conf:/etc/freeradius/clients.conf:ro
    # `-X` = debug verbose (tiap Access-Request kelihatan) — enak buat nyambungin
    # Mikrotik pertama kali. Ganti ke `-f` kalau sudah stabil.
    command: ["radiusd", "-X"]
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"

  # --- CPE / TR-069: GenieACS (modul `cpe`) ---
  # Tiga proses dari SATU image, beda `command:` saja. Pembagian tugasnya yang
  # menentukan port mana boleh keluar — jangan dibalik:
  #
  #   cwmp (7547)  perangkat pelanggan MENGHUBUNGI ini (Inform)  → WAJIB dari luar
  #   fs   (7567)  perangkat MENGUNDUH firmware dari sini        → WAJIB dari luar
  #   nbi  (7557)  API admin TANPA otentikasi apa pun            → HARAM ke luar
  #
  # Server aplikasi bicara ke `nbi` lewat jaringan compose saja (lihat
  # FTTH_CPE_GENIEACS_BASE_URL di service `server`), makanya nbi tak punya `ports:`.
  # Membukanya ke internet = siapa pun boleh reboot/ubah semua router pelanggan.
  genieacs-mongo:
    image: mongo:4.4
    restart: unless-stopped
    volumes:
      - genieacs_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12

  genieacs-cwmp:
    image: ${IMAGE_PREFIX}/ftth-genieacs:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: genieacs-cwmp
    environment:
      GENIEACS_MONGODB_CONNECTION_URL: mongodb://genieacs-mongo:27017/genieacs
      # Alamat yang DIKIRIM ke perangkat saat Download RPC firmware — dirakit jadi
      # `http://<FS_HOSTNAME>:<FS_PORT>/<berkas>`. Defaultnya hostname container,
      # yang tak berarti apa-apa bagi ONT pelanggan → wajib IP/host publik VPS.
      GENIEACS_FS_HOSTNAME: ${FTTH_CPE_PUBLIC_HOST:-}
      GENIEACS_FS_PORT: ${FTTH_CPE_FS_PORT:-7567}
    depends_on:
      genieacs-mongo:
        condition: service_healthy
    ports:
      - "${FTTH_CPE_CWMP_PORT:-7547}:7547"

  genieacs-nbi:
    image: ${IMAGE_PREFIX}/ftth-genieacs:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: genieacs-nbi
    environment:
      GENIEACS_MONGODB_CONNECTION_URL: mongodb://genieacs-mongo:27017/genieacs
    depends_on:
      genieacs-mongo:
        condition: service_healthy

  genieacs-fs:
    image: ${IMAGE_PREFIX}/ftth-genieacs:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: genieacs-fs
    environment:
      GENIEACS_MONGODB_CONNECTION_URL: mongodb://genieacs-mongo:27017/genieacs
    depends_on:
      genieacs-mongo:
        condition: service_healthy
    ports:
      - "${FTTH_CPE_FS_PORT:-7567}:7567"

  # --- Object storage bukti pengerjaan work order (internal saja) ---
  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${FTTH_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${FTTH_S3_SECRET_KEY}
    volumes:
      - miniodata:/data

  # --- Backend Spring Boot ---
  server:
    image: ${IMAGE_PREFIX}/ftth-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # Ordering saja (bukan service_healthy): pool radius-db toleran boot
      # (initializationFailTimeout=-1) — server tetap nyala walau radius-db sesaat mati,
      # aksi provisioning menumpuk PENDING lalu jalan saat radius-db pulih.
      radius-db:
        condition: service_started
    environment:
      FTTH_DB_URL: jdbc:postgresql://postgres:5432/${FTTH_DB_NAME}
      FTTH_DB_USER: ${FTTH_DB_USER}
      FTTH_DB_PASSWORD: ${FTTH_DB_PASSWORD}
      # radius-db platform (RADIUS-as-a-service): server menulis otorisasi
      # (radcheck/radusergroup/radgroupreply), membaca radacct, dan mendaftarkan klien
      # `nas` langsung ke sini via JDBC. Kredensial = rahasia platform (bukan input
      # tenant), diturunkan dari blok RADIUS_DB_* yang sama dengan freeradius/radius-db.
      FTTH_RADIUS_DB_URL: jdbc:postgresql://radius-db:5432/${RADIUS_DB_NAME:-radius}
      FTTH_RADIUS_DB_USER: ${RADIUS_DB_USER:-radius}
      FTTH_RADIUS_DB_PASSWORD: ${RADIUS_DB_PASSWORD:?wajib diisi di .env}
      # Alamat publik FreeRADIUS pusat yang DITAMPILKAN ke tenant untuk mengarahkan
      # router-nya (kartu "Arahkan router ke RADIUS ini" di UI). Biasanya = IP publik VPS
      # ini. Kosong → UI menandai "belum dikonfigurasi" (auth tetap jalan, hanya panduan
      # yang menampilkan placeholder).
      FTTH_RADIUS_PUBLIC_HOST: ${FTTH_RADIUS_PUBLIC_HOST:-}
      FTTH_JWT_SECRET: ${FTTH_JWT_SECRET}
      FTTH_ENCRYPTION_SECRET: ${FTTH_ENCRYPTION_SECRET}
      FTTH_CORS_ORIGINS: ${FTTH_CORS_ORIGINS}
      # SMTP milik PLATFORM (satu untuk semua tenant), dipakai pesan transaksional yang tak
      # boleh menumpang gateway WA tenant — mis. kode "lupa password" portal pelanggan.
      # FTTH_MAIL_FROM kosong = kanal email MATI: pesannya cuma masuk log server, jadi
      # pelanggan yang cuma punya email tak akan pernah bisa memulihkan akunnya sendiri.
      FTTH_MAIL_HOST: ${FTTH_MAIL_HOST:-}
      FTTH_MAIL_PORT: ${FTTH_MAIL_PORT:-587}
      FTTH_MAIL_USERNAME: ${FTTH_MAIL_USERNAME:-}
      FTTH_MAIL_PASSWORD: ${FTTH_MAIL_PASSWORD:-}
      FTTH_MAIL_FROM: ${FTTH_MAIL_FROM:-}
      FTTH_MAIL_FROM_NAME: ${FTTH_MAIL_FROM_NAME:-NetOps Console}
      # URL publik aplikasi untuk halaman balik gateway Pivot (mode REDIRECT WAJIB URL balik:
      # <base>/paid, /failed, /expired). Kosong → charge Pivot gagal jelas & tautan bayar tak
      # terbit ("Tautan bayar belum siap"). Biasanya = domain aplikasi (sama dgn VPN base URL).
      FTTH_BILLING_PIVOT_REDIRECT_BASE_URL: ${FTTH_BILLING_PIVOT_REDIRECT_BASE_URL:-}
      # URL publik aplikasi, di-embed ke installer VPN untuk callback dari hub VPS
      # (auth-user-pass-verify & client-connect). Kalau kosong, perintah pasang di
      # dashboard menampilkan placeholder <URL-APLIKASI-ANDA> dan installer gagal.
      FTTH_VPN_PUBLIC_BASE_URL: ${FTTH_VPN_PUBLIC_BASE_URL:-}
      FTTH_VPN_REMOTE_PORT_MIN: ${FTTH_VPN_REMOTE_PORT_MIN:-20000}
      FTTH_VPN_REMOTE_PORT_MAX: ${FTTH_VPN_REMOTE_PORT_MAX:-40000}
      FTTH_PLATFORM_ADMIN_EMAIL: ${FTTH_PLATFORM_ADMIN_EMAIL}
      FTTH_PLATFORM_ADMIN_PASSWORD: ${FTTH_PLATFORM_ADMIN_PASSWORD}
      FTTH_SEED_DEMO: ${FTTH_SEED_DEMO:-false}
      FTTH_S3_ENDPOINT: http://minio:9000
      FTTH_S3_ACCESS_KEY: ${FTTH_S3_ACCESS_KEY}
      FTTH_S3_SECRET_KEY: ${FTTH_S3_SECRET_KEY}
      FTTH_S3_BUCKET: ${FTTH_S3_BUCKET:-ftth-evidence}
      FTTH_S3_PATH_STYLE: "true"
      # CPE/TR-069: server memerintah GenieACS lewat NBI internal. SENGAJA tanpa
      # `depends_on` — sinkronisasi CPE tahan ACS mati (sekadar WARN sebaris tiap
      # ronde), jadi tak ada gunanya menyandera startup server pada Mongo.
      FTTH_CPE_GENIEACS_BASE_URL: http://genieacs-nbi:7557
      FTTH_CPE_SYNC_INTERVAL: ${FTTH_CPE_SYNC_INTERVAL:-PT5M}
      FTTH_CPE_ONLINE_STALE_AFTER: ${FTTH_CPE_ONLINE_STALE_AFTER:-PT15M}
      # Berkas uji "Uji Kecepatan" (TR-143). Yang mengunduh PERANGKAT pelanggan,
      # bukan server — alamatnya harus terjangkau dari sisi pelanggan. Nilai bawaan
      # di bawah cuma cermin default aplikasi; speedtest.tele2.net SUDAH DIMATIKAN
      # Tele2, jadi isi .env dengan berkas milikmu sendiri kalau fitur ini dipakai.
      FTTH_CPE_DIAGNOSTICS_DOWNLOAD_URL: ${FTTH_CPE_DIAGNOSTICS_DOWNLOAD_URL:-http://speedtest.tele2.net/10MB.zip}

  # --- Cadangan otomatis kedua database ---
  # Dua service, bukan satu, karena versi klien harus cocok dengan versi server:
  # dump dari pg_dump 17 memuat `SET transaction_timeout` yang DITOLAK server pg16,
  # sedangkan pg_dump 16 menolak mendump server pg17. Jadi DB aplikasi dicadangkan
  # oleh image pg17 dan DB radius oleh image pg16 — keduanya image yang SUDAH ada di
  # host ini (dipakai service postgres & radius-db), tak menambah unduhan apa pun.
  #
  # Keduanya menjalankan skrip yang sama dari ./backup, menulis ke ./backups di VPS
  # (bind mount, bukan volume, supaya operator bisa menyalinnya keluar dengan scp).
  # `user: root` supaya berkasnya bisa ditulis apa pun kepemilikan foldernya — isinya
  # seluruh basis data, jadi memang sepantasnya cuma root yang boleh baca (chmod 600).
  backup:
    image: timescale/timescaledb-ha:pg17
    restart: unless-stopped
    user: root
    entrypoint: ["/bin/sh", "/opt/backup/entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BACKUP_TARGET: app
      BACKUP_AT: ${BACKUP_AT:-02:30}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      # Pemilik database saat dipulihkan — role aplikasi, bukan superuser yang mendump.
      BACKUP_DB_OWNER: ${FTTH_DB_USER}
      TZ: ${BACKUP_TZ:-UTC}
      PGHOST: postgres
      # WAJIB superuser: tabel ber-tenant memakai FORCE ROW LEVEL SECURITY, jadi dump
      # oleh role aplikasi menghasilkan cadangan KOSONG tanpa pesan galat (backup.sh
      # menolak jalan kalau rolenya tunduk RLS).
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_SUPER_PASSWORD}
      PGDATABASE: ${FTTH_DB_NAME}
    volumes:
      - ./backup:/opt/backup:ro
      - ./backups:/backups

  backup-radius:
    image: postgres:16-alpine
    restart: unless-stopped
    user: root
    entrypoint: ["/bin/sh", "/opt/backup/entrypoint.sh"]
    depends_on:
      radius-db:
        condition: service_healthy
    environment:
      BACKUP_TARGET: radius
      # Digeser setengah jam dari cadangan aplikasi supaya dua pg_dump tak berebut I/O.
      BACKUP_AT: ${BACKUP_RADIUS_AT:-03:00}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      TZ: ${BACKUP_TZ:-UTC}
      PGHOST: radius-db
      PGUSER: ${RADIUS_DB_USER:-radius}
      PGPASSWORD: ${RADIUS_DB_PASSWORD:?wajib diisi di .env}
      PGDATABASE: ${RADIUS_DB_NAME:-radius}
    volumes:
      - ./backup:/opt/backup:ro
      - ./backups:/backups

  # --- Frontend statis (Nginx) ---
  web:
    image: ${IMAGE_PREFIX}/ftth-web:${IMAGE_TAG:-latest}
    restart: unless-stopped

  # --- Reverse proxy + TLS otomatis (satu-satunya yang terekspos ke internet) ---
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - server
      - web
    environment:
      FTTH_SITE_ADDRESS: ${FTTH_SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  radiusdata:
  miniodata:
  genieacs_mongo:
  caddy_data:
  caddy_config:
