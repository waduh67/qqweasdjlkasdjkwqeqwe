services:
  postgres:
    image: timescale/timescaledb-ha:pg17
    environment:
      POSTGRES_USER: warehouse_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${WH_ADMIN_PASSWORD:?generated environment required}
      WH_APP_PASSWORD: ${WH_APP_PASSWORD:?generated environment required}
    ports:
      - "127.0.0.1:${WH_PG_PORT:?}:5432"
    labels:
      warehouse.task: ${WH_MARKER:?}
    volumes:
      - postgres:/home/postgres/pgdata/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U warehouse_admin -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 60
    networks: [warehouse]
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: warehouse_storage
      MINIO_ROOT_PASSWORD: ${WH_MINIO_PASSWORD:?generated environment required}
    ports:
      - "127.0.0.1:${WH_S3_PORT:?}:9000"
    labels:
      warehouse.task: ${WH_MARKER:?}
    volumes:
      - minio:/data
    networks: [warehouse]
volumes:
  postgres:
    labels:
      warehouse.task: ${WH_MARKER:?}
  minio:
    labels:
      warehouse.task: ${WH_MARKER:?}
networks:
  warehouse:
    labels:
      warehouse.task: ${WH_MARKER:?}
