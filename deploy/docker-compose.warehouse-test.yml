services:
  postgres:
    image: timescale/timescaledb-ha:pg17@sha256:3e3440ab4c2aa585e743b1d8466cda9bbf18b6c598ec7806cf61e02fa5cd1d1a
    environment:
      POSTGRES_USER: warehouse_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${WH_ADMIN_PASSWORD:?generated environment required}
      WH_APP_PASSWORD: ${WH_APP_PASSWORD:?generated environment required}
    ports:
      - "127.0.0.1:${WH_PG_PORT:?}:5432"
    labels:
      warehouse.task: ${WH_MARKER:?}
    volumes:
      - postgres:/home/postgres/pgdata/data
    healthcheck:
      # The initialization server accepts Unix sockets before its final restart.
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U warehouse_admin -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 60
    networks: [warehouse]
  minio:
    image: warehouse-test-minio:release-2025-09-07-source
    build:
      context: ./minio-warehouse-test
    pull_policy: never
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: warehouse_storage
      MINIO_ROOT_PASSWORD: ${WH_MINIO_PASSWORD:?generated environment required}
    ports:
      - "127.0.0.1:${WH_S3_PORT:?}:9000"
    labels:
      warehouse.task: ${WH_MARKER:?}
    volumes:
      - minio:/data
    networks: [warehouse]
volumes:
  postgres:
    labels:
      warehouse.task: ${WH_MARKER:?}
  minio:
    labels:
      warehouse.task: ${WH_MARKER:?}
networks:
  warehouse:
    labels:
      warehouse.task: ${WH_MARKER:?}
