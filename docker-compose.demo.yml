# ============================================================================
# Stack DEMO ONLINE ftth — peniru-protokol end-to-end di server publik (mis.
# fajar@20.6.72.13), diakses lewat browser di http://<IP-SERVER>. Sama isinya
# dengan docker-compose.lab.yml (app + web + simulator + GenieACS + RADIUS),
# tapi image JVM kita DITARIK dari GHCR (bukan di-build di server); image GenieACS
# tetap di-build lokal dari checkout repo.
#
#   # di server (checkout repo di /opt/ftth-demo), setelah `.env` diisi:
#   docker compose -f docker-compose.demo.yml pull
#   docker compose -f docker-compose.demo.yml up -d --build
#   COMPOSE="docker compose -f docker-compose.demo.yml" BASE=http://localhost \
#     bash docker/lab/seed-lab.sh
#   # buka http://<IP-SERVER>  → login admin@demo.ftth / admin12345
#
# Nilai sensitif diambil dari `.env` (lihat deploy/.env.demo.example) — TAK ada
# secret di file ini. Secret app lain pakai DEFAULT DEV (jwt/encryption/S3) karena
# ini DEMO, bukan produksi. JANGAN dipakai untuk data sungguhan.
#
# Project name terpisah (`ftth-demo`) agar volume/kontainer tak bentrok dengan lab
# maupun prod. Hanya Caddy yang membuka port ke host (80).
# ============================================================================
name: ftth-demo

services:
  # --- Database aplikasi (PostGIS + TimescaleDB) — internal ---
  postgres:
    image: timescale/timescaledb-ha:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      FTTH_DB_USER: ftth
      FTTH_DB_PASSWORD: ftth
      FTTH_DB_NAME: ftth
    volumes:
      - pgdata:/home/postgres/pgdata/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- Object storage bukti pengerjaan work order (internal) ---
  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ftth
      MINIO_ROOT_PASSWORD: ftthminio
    volumes:
      - miniodata:/data

  # --- Backend Spring Boot (image dari GHCR) ---
  server:
    image: ${IMAGE_PREFIX:-ghcr.io/waduh67}/ftth-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      radius-db:
        condition: service_healthy
    environment:
      FTTH_DB_URL: jdbc:postgresql://postgres:5432/ftth
      FTTH_DB_USER: ftth
      FTTH_DB_PASSWORD: ftth
      FTTH_S3_ENDPOINT: http://minio:9000
      FTTH_S3_ACCESS_KEY: ftth
      FTTH_S3_SECRET_KEY: ftthminio
      # Origin publik demo (domain + HTTPS; override lewat `.env` bila ganti domain).
      FTTH_CORS_ORIGINS: ${FTTH_CORS_ORIGINS:-https://simulator-ftth.karuhundeveloper.com}
      # Seed tenant demo → login tenant admin: admin@demo.ftth / admin12345.
      # Platform admin (lintas tenant): root@ftth.local / rootadmin123.
      FTTH_SEED_DEMO: "true"
      # --- RADIUS-as-a-service: server pegang radius-db langsung (provision radcheck +
      #     baca radacct + tembak DAE). Simulator BRAS memerankan sisi-NAS di DB yang sama. ---
      FTTH_RADIUS_DB_URL: jdbc:postgresql://radius-db:5432/radius
      FTTH_RADIUS_DB_USER: radius
      FTTH_RADIUS_DB_PASSWORD: radius
      # Host FreeRADIUS pusat yang "tenant arahkan router-nya" — di demo = nama service simulator.
      FTTH_RADIUS_PUBLIC_HOST: simulator
      # Poll OLT SNMP tiap 30 dtk (baku PT5M) agar status ONU cepat kelihatan di demo.
      FTTH_MONITORING_POLL_INTERVAL: PT30S
      # --- CPE/TR-069: NBI GenieACS di jaringan compose (bukan localhost). ---
      FTTH_CPE_GENIEACS_BASE_URL: http://genieacs-nbi:7557
      # Sinkron CPE↔ONU tiap 30 dtk (baku PT5M) agar tautan serial 000000 cepat muncul.
      FTTH_CPE_SYNC_INTERVAL: PT30S
      # jwt-secret / encryption-secret sengaja tidak di-set → pakai default dev.

  # --- Frontend SPA (image dari GHCR, disajikan Nginx) ---
  web:
    image: ${IMAGE_PREFIX:-ghcr.io/waduh67}/ftth-web:${IMAGE_TAG:-latest}
    restart: unless-stopped

  # --- Reverse proxy: satu pintu ke internet (/api → server, sisanya → web) ---
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - server
      - web
    environment:
      # ":80" = HTTP saja (akses lewat http://<IP-SERVER>). Ganti ke domain di `.env`
      # (FTTH_SITE_ADDRESS=app.contoh.com) → Caddy urus HTTPS otomatis (buka 443 juga).
      FTTH_SITE_ADDRESS: ${FTTH_SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # --- Demo BRAS/RADIUS: Postgres berisi skema FreeRADIUS + 1 sesi contoh hidup ---
  radius-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: radius
      POSTGRES_USER: radius
      POSTGRES_PASSWORD: radius
    volumes:
      - radius_db:/var/lib/postgresql/data
      - ./docker/radius/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radius"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- Simulator peniru-protokol: OLT/SNMP + BRAS/RADIUS (virtual-NAS) — image dari GHCR ---
  # Menggantikan perangkat nyata. Tak mengekspos port ke host: server & sim bicara
  # lewat jaringan compose. IP statis 172.30.0.10 (value-object ManagementIp menolak
  # hostname) — server polling SNMP ke 172.30.0.10:1161 & tembak DAE ke :3799 (lihat seed-lab.sh).
  simulator:
    image: ${IMAGE_PREFIX:-ghcr.io/waduh67}/ftth-simulator:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      radius-db:
        condition: service_healthy
    networks:
      default:
        ipv4_address: 172.30.0.10
    environment:
      FTTH_SIM_OLT_PORT: "1161"
      FTTH_SIM_OLT_COMMUNITY: public
      FTTH_SIM_OLT_PONS: "2"
      FTTH_SIM_OLT_ONUS_PER_PON: "8"
      FTTH_SIM_RADIUS_DB_URL: jdbc:postgresql://radius-db:5432/radius
      FTTH_SIM_RADIUS_DB_USER: radius
      FTTH_SIM_RADIUS_DB_PASSWORD: radius
      # Secret DAE HARUS sama dengan coaSecret BRAS yang di-seed (lihat seed-lab.sh).
      FTTH_SIM_RADIUS_DAE_SECRET: testing123

  # --- GenieACS (TR-069) + 1 ONT palsu — modul CPE. Build lokal (image Node ringan). ---
  genieacs-mongo:
    image: mongo:4.4
    restart: unless-stopped
    volumes:
      - genieacs_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  genieacs-cwmp:
    build: ./docker/genieacs
    image: ftth/genieacs:1.2.16
    restart: unless-stopped
    command: genieacs-cwmp
    environment:
      GENIEACS_MONGODB_CONNECTION_URL: mongodb://genieacs-mongo:27017/genieacs
    depends_on:
      genieacs-mongo:
        condition: service_healthy

  genieacs-nbi:
    build: ./docker/genieacs
    image: ftth/genieacs:1.2.16
    restart: unless-stopped
    command: genieacs-nbi
    environment:
      GENIEACS_MONGODB_CONNECTION_URL: mongodb://genieacs-mongo:27017/genieacs
    depends_on:
      genieacs-mongo:
        condition: service_healthy

  genieacs-sim:
    build: ./docker/genieacs-sim
    image: ftth/genieacs-sim:local
    restart: unless-stopped
    command: ["-u", "http://genieacs-cwmp:7547/"]
    depends_on:
      genieacs-cwmp:
        condition: service_started

volumes:
  pgdata:
  miniodata:
  radius_db:
  genieacs_mongo:
  caddy_data:
  caddy_config:

# Subnet tetap agar simulator bisa dapat IP statis (172.30.0.10). Semua service
# tetap saling kenal lewat nama (DNS embedded Docker). `ip_range` membatasi kolam
# alokasi dinamis ke paruh atas supaya IP statis simulator tak pernah terserempet.
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          ip_range: 172.30.0.128/25
          gateway: 172.30.0.1
