# ============================================================================
# Stack SIMULATOR ONLINE ftth — peniru-protokol OLT/SNMP + BRAS/RADIUS di server
# publik (fajar@20.6.72.13). TUJUAN: menyediakan "perangkat palsu" yang bisa
# di-poll & ditembak DAE oleh APLIKASI PRODUKSI (ftth.karuhundeveloper.com) di
# host yang sama — buat testing SNMP/isolir tanpa perangkat nyata.
#
# CAKUPAN SENGAJA DIPANGKAS ke `simulator` + `radius-db` saja (bukan demo penuh):
# app/web/GenieACS TIDAK dijalankan di sini — yang mengakses simulator adalah
# app PRODUKSI, jadi tak perlu app kedua. Tak ada Caddy, tak ada port ke host.
#
# CARA PROD MENGAKSES (zero-downtime, tanpa polusi accounting prod):
#   • Simulator dengar SNMP di IP STATIS 172.30.0.10 (UDP 1161-1165, community
#     `public`) + DAE/CoA di :3799 (secret `testing123`). IP statis wajib karena
#     value-object ManagementIp menolak hostname.
#   • Container app prod (`ftth-server-1`) disambungkan ke network stack ini
#     (`docker network connect ftth-demo_default ftth-server-1`) → app prod bisa
#     langsung poll 172.30.0.10 & tembak DAE, TANPA merestart apa pun.
#   • Slice BRAS/RADIUS simulator menulis ke `radius-db` TERPISAH (bukan DB prod),
#     jadi accounting tenant produksi tetap bersih.
#
#   # di server (file repo di /opt/ftth-demo), setelah `.env` diisi:
#   docker compose -f docker-compose.demo.yml pull simulator
#   docker compose -f docker-compose.demo.yml up -d simulator radius-db
#   docker network connect ftth-demo_default ftth-server-1   # sambungkan app prod (idempoten)
#   # lalu daftarkan OLT (172.30.0.10:1161 community public) + BRAS (172.30.0.10
#   # coaSecret testing123, reachability DIRECT) lewat UI PRODUKSI. Lihat DEPLOY-DEMO.md.
#
# Nilai sensitif diambil dari `.env` (lihat deploy/.env.demo.example) — TAK ada
# secret di file ini. Ini rig-uji, BUKAN produksi; JANGAN dipakai data sungguhan.
#
# Project name terpisah (`ftth-demo`) agar network/volume/kontainer tak bentrok
# dengan prod (`ftth`) maupun lab. Tak ada port yang diekspos ke host.
# ============================================================================
name: ftth-demo

services:
  # --- Slice BRAS/RADIUS simulator: Postgres berisi skema FreeRADIUS terpisah dari
  #     DB produksi (accounting simulator TIDAK mencemari accounting tenant prod). ---
  radius-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: radius
      POSTGRES_USER: radius
      POSTGRES_PASSWORD: radius
    volumes:
      - radius_db:/var/lib/postgresql/data
      - ./docker/radius/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radius"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- Simulator peniru-protokol: OLT/SNMP + BRAS/RADIUS (virtual-NAS) — image dari GHCR ---
  # Menggantikan perangkat nyata. Tak mengekspos port ke host: app prod bicara ke
  # simulator lewat network compose ini (setelah `ftth-server-1` disambungkan).
  # IP statis 172.30.0.10 (value-object ManagementIp menolak hostname) — app prod
  # polling SNMP ke 172.30.0.10:1161 & tembak DAE ke :3799.
  simulator:
    image: ${IMAGE_PREFIX:-ghcr.io/waduh67}/ftth-simulator:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      radius-db:
        condition: service_healthy
    networks:
      default:
        ipv4_address: 172.30.0.10
    environment:
      FTTH_SIM_OLT_PORT: "1161"
      FTTH_SIM_OLT_COMMUNITY: public
      FTTH_SIM_OLT_PONS: "2"
      FTTH_SIM_OLT_ONUS_PER_PON: "8"
      FTTH_SIM_RADIUS_DB_URL: jdbc:postgresql://radius-db:5432/radius
      FTTH_SIM_RADIUS_DB_USER: radius
      FTTH_SIM_RADIUS_DB_PASSWORD: radius
      # Secret DAE HARUS sama dengan coaSecret BRAS yang didaftarkan di app prod.
      FTTH_SIM_RADIUS_DAE_SECRET: testing123

volumes:
  radius_db:

# Subnet tetap agar simulator bisa dapat IP statis (172.30.0.10). `ip_range`
# membatasi kolam alokasi dinamis ke paruh atas supaya IP statis simulator tak
# pernah terserempet — termasuk saat `ftth-server-1` prod ikut nyambung ke sini.
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          ip_range: 172.30.0.128/25
          gateway: 172.30.0.1
