[versions]
# Kotlin disamakan dengan versi yang di-manage Spring Boot BOM 4.1.0
kotlin = "2.3.21"
spring-boot = "4.1.0"
spring-modulith = "2.1.0"
springdoc = "3.0.3"
awssdk = "2.29.52"
snmp4j = "3.8.2"
jackson = "3.0.4"
logback = "1.5.20"
# API logging modul :snmp (snmp4j hanya menaruh slf4j-api di runtime, bukan compile);
# disamakan dengan yang ditarik logback 1.5.20.
slf4j = "2.0.17"
# Driver JDBC untuk adapter FreeRADIUS collector — disamakan dengan versi yang di-resolve server.
postgresql = "42.7.11"
# PKI OpenVPN: app menerbitkan CA + sertifikat server sendiri (module vpn).
bouncycastle = "1.80"
compose = "1.9.3"
compose-fluent = "0.1.0"
agp = "8.5.2"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "spring-modulith" }
springdoc-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

# Object storage bukti pengerjaan (MinIO/S3-compatible). Versi s3 dikelola BOM.
awssdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "awssdk" }
awssdk-s3 = { module = "software.amazon.awssdk:s3" }

# Dipakai modul :snmp (adapter OLT), yang ditarik bersama oleh :collector & :server.
snmp4j = { module = "org.snmp4j:snmp4j", version.ref = "snmp4j" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-kotlin = { module = "tools.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }

# PKI OpenVPN untuk module vpn (server menerbitkan CA + sertifikat server).
bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
