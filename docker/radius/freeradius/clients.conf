# Klien RADIUS statis untuk lab (selain yang dibaca dari tabel nas via SQL).
#
# CATATAN: daftar BRAS sebenarnya dibaca dari tabel `nas` (read_clients=yes di modul sql),
# jadi blok di sini hanya cadangan agar container tetap hidup meski SQL belum siap, plus
# mengizinkan pengujian dari host/LAN docker. Secret 'testing123' = LAB SAJA, jangan dipakai
# di produksi.

client localhost {
    ipaddr = 127.0.0.1
    secret = testing123
    shortname = localhost
}

# Seluruh rentang privat docker/LAN diizinkan dengan satu secret — memudahkan Mikrotik CHR
# atau collector menembak dari mana pun di jaringan lab.
client lab-private-10 {
    ipaddr = 10.0.0.0/8
    secret = testing123
    shortname = lab-10
}

client lab-private-172 {
    ipaddr = 172.16.0.0/12
    secret = testing123
    shortname = lab-172
}

client lab-private-192 {
    ipaddr = 192.168.0.0/16
    secret = testing123
    shortname = lab-192
}
