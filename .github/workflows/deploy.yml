name: deploy

# Setiap push ke main: jalankan test -> build image server & web -> push ke
# GHCR -> SSH ke VPS lalu `docker compose pull && up -d`.
# Bisa juga dijalankan manual dari tab Actions (workflow_dispatch).
on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: deploy-production
    cancel-in-progress: false

env:
    IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
    warehouse-verification:
        uses: ./.github/workflows/warehouse.yml
        permissions:
            contents: read

    build-and-push:
        needs: warehouse-verification
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - name: Login ke GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: actions/download-artifact@v4
              with:
                  name: warehouse-tested-images-${{ github.sha }}
                  path: .omo/runtime/tested-images

            - name: Publish only the exact tested server and web images
              run: |
                  set -euo pipefail
                  python3 scripts/warehouse/publish-images.py .omo/runtime/tested-images \
                    --commit "$GITHUB_SHA" --prefix "$IMAGE_PREFIX"

            - uses: actions/upload-artifact@v4
              with:
                  name: warehouse-published-images-${{ github.sha }}
                  path: .omo/runtime/tested-images/published.json
                  if-no-files-found: error
                  retention-days: 14

            # GenieACS (ACS TR-069 untuk modul `cpe`). Isinya cuma `npm i -g
            # genieacs@<versi pin>`, jadi tak berubah tiap commit — tetap ikut
            # didorong supaya VPS cukup `pull` seperti image lain (tak perlu build
            # di sana, dan versinya dikunci repo, bukan image pihak ketiga).
            - name: Build & push ftth-genieacs
              uses: docker/build-push-action@v6
              with:
                  context: ./docker/genieacs
                  file: docker/genieacs/Dockerfile
                  push: true
                  tags: |
                      ${{ env.IMAGE_PREFIX }}/ftth-genieacs:latest
                      ${{ env.IMAGE_PREFIX }}/ftth-genieacs:${{ github.sha }}
                  provenance: false
                  sbom: false
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    # -------------------------------------------------------------------------
    # 4) SSH ke VPS: tarik image terbaru lalu naikkan ulang stack.
    # -------------------------------------------------------------------------
    deploy:
        needs: build-and-push
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/download-artifact@v4
              with:
                  name: warehouse-published-images-${{ github.sha }}
                  path: verified-release

            - name: Read immutable verified registry references
              run: |
                  python3 - <<'PY'
                  import hashlib, json, os, re
                  from pathlib import Path
                  proof = json.loads(Path('verified-release/published.json').read_text())
                  assert proof['commit'] == os.environ['GITHUB_SHA']
                  assert set(proof['images']) == {'server', 'web'}
                  with open(os.environ['GITHUB_ENV'], 'a') as output:
                      for service, image in proof['images'].items():
                          reference = image['registryDigest']
                          expected = re.escape(os.environ['IMAGE_PREFIX'] + '/ftth-' + service)
                          assert re.fullmatch(expected + r'@sha256:[a-f0-9]{64}', reference)
                          output.write('FTTH_' + service.upper() + '_IMAGE=' + reference + '\n')
                      checksum = hashlib.sha256(Path('deploy/docker-compose.prod.yml').read_bytes()).hexdigest()
                      output.write('FTTH_COMPOSE_SHA256=' + checksum + '\n')
                  PY

            - name: Install cloudflared
              run: |
                  curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
                  sudo dpkg -i cloudflared.deb
                  rm -f cloudflared.deb

            - name: Konfigurasi SSH & Cloudflare Access
              env:
                  VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
                  VPS_HOST: ${{ secrets.VPS_HOST }}
                  VPS_USER: ${{ secrets.VPS_USER }}
              run: |
                  mkdir -p ~/.ssh
                  chmod 700 ~/.ssh
                  printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_rsa
                  chmod 600 ~/.ssh/id_rsa
                  cat << 'EOF' > ~/.ssh/config
                  Host ${{ secrets.VPS_HOST }}
                      ProxyCommand cloudflared access ssh --hostname %h
                      User ${{ secrets.VPS_USER }}
                      IdentityFile ~/.ssh/id_rsa
                      StrictHostKeyChecking no
                      UserKnownHostsFile /dev/null
                  EOF
                  chmod 600 ~/.ssh/config

            - name: Upload the reviewed release files through Cloudflare Access
              env:
                  VPS_HOST: ${{ secrets.VPS_HOST }}
              run: |
                  set -euo pipefail
                  release="/opt/ftth/releases/$GITHUB_SHA"
                  ssh "$VPS_HOST" "mkdir -p '$release'"
                  scp verified-release/published.json scripts/deploy/activate-verified.py "$VPS_HOST:$release/"
                  scp deploy/docker-compose.prod.yml "$VPS_HOST:$release/docker-compose.prod.yml"
                  scp deploy/Caddyfile "$VPS_HOST:$release/Caddyfile"
                  scp -r deploy/postgres-init deploy/radius deploy/backup deploy/monitoring "$VPS_HOST:$release/"

            - name: Deploy lewat SSH
              env:
                  VPS_HOST: ${{ secrets.VPS_HOST }}
                  GHCR_PAT: ${{ secrets.GHCR_PAT }}
                  GHCR_USER: ${{ secrets.GHCR_USER }}
                  FTTH_SERVER_IMAGE: ${{ env.FTTH_SERVER_IMAGE }}
                  FTTH_WEB_IMAGE: ${{ env.FTTH_WEB_IMAGE }}
                  FTTH_COMPOSE_SHA256: ${{ env.FTTH_COMPOSE_SHA256 }}
              run: |
                  set -euo pipefail
                  [[ "$GHCR_USER" =~ ^[A-Za-z0-9_-]+$ ]]
                  topology="$(ssh "$VPS_HOST" 'sudo -n bash -s' <<'DETECT'
                  set -euo pipefail
                  cd /opt/ftth
                  test -r .env
                  test -r docker-compose.prod.yml
                  if [[ -e ftth-compose || -L ftth-compose ]]; then
                    test -f ftth-compose
                    test -x ftth-compose
                    test -r docker-compose.images.json
                    printf 'wrapper\n'
                  elif [[ ! -e docker-compose.images.json && ! -e docker-compose.shared-proxy.yml ]]; then
                    systemctl is-active --quiet nginx
                    printf 'native\n'
                  else
                    echo 'Unrecognized deployment topology' >&2
                    exit 1
                  fi
                  DETECT
                  )"
                  [[ "$topology" == wrapper || "$topology" == native ]]
                  if [[ "$topology" == wrapper ]]; then
                    printf '%s\n' "$GHCR_PAT" | ssh "$VPS_HOST" "sudo -n docker login ghcr.io -u '$GHCR_USER' --password-stdin"
                    ssh "$VPS_HOST" "sudo -n python3 '/opt/ftth/releases/$GITHUB_SHA/activate-verified.py' '/opt/ftth/releases/$GITHUB_SHA' '$GITHUB_SHA'"
                    exit 0
                  fi
                  printf '%s\n' "$GHCR_PAT" | ssh "$VPS_HOST" "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
                  # Only validated commit/digest values enter the remote shell command.
                  [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
                  [[ "$FTTH_SERVER_IMAGE" =~ ^ghcr.io/[a-z0-9_-]+/ftth-server@sha256:[a-f0-9]{64}$ ]]
                  [[ "$FTTH_WEB_IMAGE" =~ ^ghcr.io/[a-z0-9_-]+/ftth-web@sha256:[a-f0-9]{64}$ ]]
                  [[ "$FTTH_COMPOSE_SHA256" =~ ^[a-f0-9]{64}$ ]]
                  ssh "$VPS_HOST" "IMAGE_TAG='$GITHUB_SHA' FTTH_SERVER_IMAGE='$FTTH_SERVER_IMAGE' FTTH_WEB_IMAGE='$FTTH_WEB_IMAGE' FTTH_COMPOSE_SHA256='$FTTH_COMPOSE_SHA256' bash -s" <<'EOF'
                  set -euo pipefail
                  cd /opt/ftth
                  export IMAGE_TAG FTTH_SERVER_IMAGE FTTH_WEB_IMAGE
                  release="releases/$IMAGE_TAG"
                  release_compose="$release/docker-compose.prod.yml"
                  printf '%s  %s\n' "$FTTH_COMPOSE_SHA256" "$release_compose" | sha256sum --check --status
                  # Preserve existing relative bind mounts while keeping a release copy.
                  cp "$release/Caddyfile" .
                  cp -R "$release/postgres-init" "$release/radius" "$release/backup" "$release/monitoring" .
                  docker compose --project-directory /opt/ftth --env-file /opt/ftth/.env -f "$release_compose" config --quiet
                  docker compose --project-directory /opt/ftth --env-file /opt/ftth/.env -f "$release_compose" pull
                  docker compose --project-directory /opt/ftth --env-file /opt/ftth/.env -f "$release_compose" up -d
                  EOF

            - name: Verifikasi situs produksi
              run: |
                  curl --fail --silent --show-error \
                    --retry 24 --retry-delay 5 --retry-all-errors \
                    https://ftth.karuhundeveloper.com/ > /dev/null
