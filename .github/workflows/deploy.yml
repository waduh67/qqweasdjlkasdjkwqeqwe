name: deploy

# Setiap push ke main: jalankan test -> build image server & web -> push ke
# GHCR -> SSH ke VPS lalu `docker compose pull && up -d`.
# Bisa juga dijalankan manual dari tab Actions (workflow_dispatch).
on:
    push:
        branches: [main]
    workflow_dispatch:

env:
    IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
    # -------------------------------------------------------------------------
    # 1) Test integrasi di atas Postgres asli (role non-superuser -> RLS teruji).
    # -------------------------------------------------------------------------
    # test:
    #   runs-on: ubuntu-latest
    #   services:
    #     postgres:
    #       image: timescale/timescaledb-ha:pg17
    #       env:
    #         POSTGRES_USER: postgres
    #         POSTGRES_PASSWORD: postgres
    #       ports:
    #         - 5432:5432
    #       options: >-
    #         --health-cmd "pg_isready -U postgres"
    #         --health-interval 10s
    #         --health-timeout 5s
    #         --health-retries 12
    #   steps:
    #     - uses: actions/checkout@v4

    #     - name: Siapkan role & database test
    #       env:
    #         PGPASSWORD: postgres
    #       run: |
    #         psql -h localhost -U postgres -c "CREATE ROLE ftth LOGIN PASSWORD 'ftth' NOSUPERUSER NOCREATEROLE NOBYPASSRLS;"
    #         psql -h localhost -U postgres -c "CREATE DATABASE ftth_test OWNER ftth;"
    #         psql -h localhost -U postgres -d ftth_test -c "CREATE EXTENSION IF NOT EXISTS postgis; CREATE EXTENSION IF NOT EXISTS timescaledb;"

    #     - uses: actions/setup-java@v4
    #       with:
    #         distribution: temurin
    #         java-version: "21"

    #     - uses: gradle/actions/setup-gradle@v4

    #     - name: Jalankan test server
    #       run: ./gradlew :server:test --no-daemon

    # -------------------------------------------------------------------------
    # 2) Build kedua image lalu dorong ke GitHub Container Registry.
    # -------------------------------------------------------------------------
    build-and-push:
        # `test` sementara dinonaktifkan (dikomentari di atas) — jangan `needs: test`,
        # kalau tidak seluruh job punya dependensi & GitHub menolak workflow-nya.
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - name: Login ke GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build & push ftth-server
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: server/Dockerfile
                  push: true
                  tags: |
                      ${{ env.IMAGE_PREFIX }}/ftth-server:latest
                      ${{ env.IMAGE_PREFIX }}/ftth-server:${{ github.sha }}
                  # Matikan attestation provenance/SBOM: manifest attestation-nya memicu
                  # 403 saat push blob ke GHCR pada tag kedua (git-sha), dan tak diperlukan
                  # untuk pipeline deploy privat ini.
                  provenance: false
                  sbom: false
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Build & push ftth-web
              uses: docker/build-push-action@v6
              with:
                  context: ./web
                  file: web/Dockerfile
                  push: true
                  tags: |
                      ${{ env.IMAGE_PREFIX }}/ftth-web:latest
                      ${{ env.IMAGE_PREFIX }}/ftth-web:${{ github.sha }}
                  provenance: false
                  sbom: false
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            # Peniru protokol (OLT/SNMP + BRAS/RADIUS) untuk stack DEMO. Context =
            # root repo (butuh :contract, :snmp, :simulator). Hanya dipakai deploy-demo;
            # prod tak menariknya.
            - name: Build & push ftth-simulator
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: simulator/Dockerfile
                  push: true
                  tags: |
                      ${{ env.IMAGE_PREFIX }}/ftth-simulator:latest
                      ${{ env.IMAGE_PREFIX }}/ftth-simulator:${{ github.sha }}
                  provenance: false
                  sbom: false
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    # -------------------------------------------------------------------------
    # 3) SSH ke VPS: tarik image terbaru lalu naikkan ulang stack.
    # -------------------------------------------------------------------------
    deploy:
        needs: build-and-push
        runs-on: ubuntu-latest
        steps:
            - name: Deploy lewat SSH
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  script: |
                      set -e
                      cd /opt/ftth
                      echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin
                      docker compose -f docker-compose.prod.yml pull
                      docker compose -f docker-compose.prod.yml up -d
                      docker image prune -f

    # -------------------------------------------------------------------------
    # 4) SERVER DEMO: stack peniru-protokol end-to-end (app + web + simulator +
    #    GenieACS + RADIUS) di https://simulator-ftth.karuhundeveloper.com. Berdiri
    #    sendiri, TERPISAH dari `deploy` prod di atas — TAPI CO-LOCATED di host yang
    #    sama dengan produksi (ftth.karuhundeveloper.com). Konsekuensinya:
    #      • /opt/ftth-demo BUKAN git checkout → file di-`rsync` dari runner (bukan git pull).
    #      • Ingress lewat Caddy PROD (`ftth-caddy-1`): job menyambungkan caddy ke network
    #        demo lalu reload (idempoten). Site-block domain demo hidup permanen di
    #        /opt/ftth/Caddyfile pada server (lihat deploy/DEPLOY-DEMO.md).
    #      • Stack demo TAK punya Caddy sendiri (tak ada port host yang dibuka).
    #    Image JVM ditarik dari GHCR; image GenieACS dibangun lokal (`--build`).
    #    Butuh secret DEMO_HOST/DEMO_USER/DEMO_SSH_KEY (+ GHCR_USER/GHCR_PAT).
    # -------------------------------------------------------------------------
    deploy-demo:
        needs: build-and-push
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Siapkan kunci SSH runner→server demo
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.DEMO_SSH_KEY }}" > ~/.ssh/id_deploy
                  chmod 600 ~/.ssh/id_deploy
                  ssh-keyscan -H "${{ secrets.DEMO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

            # /opt/ftth-demo bukan repo git → sinkronkan file yang dibutuhkan compose
            # (docker-compose.demo.yml, deploy/, docker/) dari runner. `--exclude .env*`
            # WAJIB: `.env` server tak boleh ikut terhapus oleh `--delete`.
            - name: Rsync file repo ke server demo
              run: |
                  rsync -az --delete \
                    --exclude '.git' --exclude '.env' --exclude '.env*' \
                    --exclude 'web/node_modules' --exclude '**/build' \
                    --exclude '.gradle' --exclude '**/.gradle' \
                    -e "ssh -i ~/.ssh/id_deploy" \
                    ./ "${{ secrets.DEMO_USER }}@${{ secrets.DEMO_HOST }}:/opt/ftth-demo/"

            - name: Deploy + wire ingress + seed
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.DEMO_HOST }}
                  username: ${{ secrets.DEMO_USER }}
                  key: ${{ secrets.DEMO_SSH_KEY }}
                  script: |
                      set -e
                      cd /opt/ftth-demo
                      echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin
                      docker compose -f docker-compose.demo.yml pull
                      docker compose -f docker-compose.demo.yml up -d --build --remove-orphans
                      # Ingress co-located: sambungkan Caddy prod ke network demo lalu reload
                      # (keduanya idempoten — aman diulang tiap deploy).
                      docker network connect ftth-demo_default ftth-caddy-1 2>/dev/null || true
                      docker exec ftth-caddy-1 caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
                      # Tunggu server demo sehat (via domain) sebelum seeding.
                      for i in $(seq 1 60); do
                        code=$(curl -s -o /dev/null -w '%{http_code}' https://simulator-ftth.karuhundeveloper.com/v3/api-docs || true)
                        [ "$code" = "200" ] && break
                        sleep 3
                      done
                      COMPOSE="docker compose -f docker-compose.demo.yml" \
                        BASE=https://simulator-ftth.karuhundeveloper.com \
                        bash docker/lab/seed-lab.sh
                      docker image prune -f
