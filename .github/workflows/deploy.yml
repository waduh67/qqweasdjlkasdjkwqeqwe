name: deploy

# Setiap push ke main: jalankan test -> build image server & web -> push ke
# GHCR -> SSH ke VPS lalu `docker compose pull && up -d`.
# Bisa juga dijalankan manual dari tab Actions (workflow_dispatch).
on:
    push:
        branches: [main]
    workflow_dispatch:

env:
    IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
    # -------------------------------------------------------------------------
    # 1) Test integrasi di atas Postgres asli (role non-superuser -> RLS teruji).
    # -------------------------------------------------------------------------
    # test:
    #   runs-on: ubuntu-latest
    #   services:
    #     postgres:
    #       image: timescale/timescaledb-ha:pg17
    #       env:
    #         POSTGRES_USER: postgres
    #         POSTGRES_PASSWORD: postgres
    #       ports:
    #         - 5432:5432
    #       options: >-
    #         --health-cmd "pg_isready -U postgres"
    #         --health-interval 10s
    #         --health-timeout 5s
    #         --health-retries 12
    #   steps:
    #     - uses: actions/checkout@v4

    #     - name: Siapkan role & database test
    #       env:
    #         PGPASSWORD: postgres
    #       run: |
    #         psql -h localhost -U postgres -c "CREATE ROLE ftth LOGIN PASSWORD 'ftth' NOSUPERUSER NOCREATEROLE NOBYPASSRLS;"
    #         psql -h localhost -U postgres -c "CREATE DATABASE ftth_test OWNER ftth;"
    #         psql -h localhost -U postgres -d ftth_test -c "CREATE EXTENSION IF NOT EXISTS postgis; CREATE EXTENSION IF NOT EXISTS timescaledb;"

    #     - uses: actions/setup-java@v4
    #       with:
    #         distribution: temurin
    #         java-version: "21"

    #     - uses: gradle/actions/setup-gradle@v4

    #     - name: Jalankan test server
    #       run: ./gradlew :server:test --no-daemon

    # -------------------------------------------------------------------------
    # 2) Uji web (vitest). Beda dari test server di atas, job ini tak butuh service
    #    apa pun dan selesai dalam hitungan detik — jadi ia LAYAK jadi gerbang deploy.
    # -------------------------------------------------------------------------
    web-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: web/package-lock.json

            - run: npm ci
              working-directory: web

            - run: npm run lint
              working-directory: web

            - run: npm test
              working-directory: web

    # -------------------------------------------------------------------------
    # 3) Build kedua image lalu dorong ke GitHub Container Registry.
    # -------------------------------------------------------------------------
    build-and-push:
        # `test` server sementara dinonaktifkan (dikomentari di atas) — jangan
        # `needs: test`, kalau tidak GitHub menolak workflow-nya. Uji web ikut jadi
        # gerbang: image tak dibangun kalau konsolnya sendiri sudah gagal diuji.
        needs: web-test
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - name: Login ke GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build & push ftth-server
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: server/Dockerfile
                  push: true
                  tags: |
                      ${{ env.IMAGE_PREFIX }}/ftth-server:latest
                      ${{ env.IMAGE_PREFIX }}/ftth-server:${{ github.sha }}
                  # Matikan attestation provenance/SBOM: manifest attestation-nya memicu
                  # 403 saat push blob ke GHCR pada tag kedua (git-sha), dan tak diperlukan
                  # untuk pipeline deploy privat ini.
                  provenance: false
                  sbom: false
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Build & push ftth-web
              uses: docker/build-push-action@v6
              with:
                  context: ./web
                  file: web/Dockerfile
                  push: true
                  tags: |
                      ${{ env.IMAGE_PREFIX }}/ftth-web:latest
                      ${{ env.IMAGE_PREFIX }}/ftth-web:${{ github.sha }}
                  provenance: false
                  sbom: false
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            # GenieACS (ACS TR-069 untuk modul `cpe`). Isinya cuma `npm i -g
            # genieacs@<versi pin>`, jadi tak berubah tiap commit — tetap ikut
            # didorong supaya VPS cukup `pull` seperti image lain (tak perlu build
            # di sana, dan versinya dikunci repo, bukan image pihak ketiga).
            - name: Build & push ftth-genieacs
              uses: docker/build-push-action@v6
              with:
                  context: ./docker/genieacs
                  file: docker/genieacs/Dockerfile
                  push: true
                  tags: |
                      ${{ env.IMAGE_PREFIX }}/ftth-genieacs:latest
                      ${{ env.IMAGE_PREFIX }}/ftth-genieacs:${{ github.sha }}
                  provenance: false
                  sbom: false
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    # -------------------------------------------------------------------------
    # 4) SSH ke VPS: tarik image terbaru lalu naikkan ulang stack.
    # -------------------------------------------------------------------------
    deploy:
        needs: build-and-push
        runs-on: ubuntu-latest
        steps:
            - name: Deploy lewat SSH
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  script: |
                      set -e
                      cd /opt/ftth
                      echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin
                      docker compose -f docker-compose.prod.yml pull
                      docker compose -f docker-compose.prod.yml up -d
                      docker image prune -f
