name: deploy

# Setiap push ke main: jalankan test -> build image server & web -> push ke
# GHCR -> SSH ke VPS lalu `docker compose pull && up -d`.
# Bisa juga dijalankan manual dari tab Actions (workflow_dispatch).
on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: deploy-production
    cancel-in-progress: false

env:
    IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
    # -------------------------------------------------------------------------
    # 1) Test integrasi di atas Postgres asli (role non-superuser -> RLS teruji).
    # -------------------------------------------------------------------------
    # test:
    #   runs-on: ubuntu-latest
    #   services:
    #     postgres:
    #       image: timescale/timescaledb-ha:pg17
    #       env:
    #         POSTGRES_USER: postgres
    #         POSTGRES_PASSWORD: postgres
    #       ports:
    #         - 5432:5432
    #       options: >-
    #         --health-cmd "pg_isready -U postgres"
    #         --health-interval 10s
    #         --health-timeout 5s
    #         --health-retries 12
    #   steps:
    #     - uses: actions/checkout@v4

    #     - name: Siapkan role & database test
    #       env:
    #         PGPASSWORD: postgres
    #       run: |
    #         psql -h localhost -U postgres -c "CREATE ROLE ftth LOGIN PASSWORD 'ftth' NOSUPERUSER NOCREATEROLE NOBYPASSRLS;"
    #         psql -h localhost -U postgres -c "CREATE DATABASE ftth_test OWNER ftth;"
    #         psql -h localhost -U postgres -d ftth_test -c "CREATE EXTENSION IF NOT EXISTS postgis; CREATE EXTENSION IF NOT EXISTS timescaledb;"

    #     - uses: actions/setup-java@v4
    #       with:
    #         distribution: temurin
    #         java-version: "21"

    #     - uses: gradle/actions/setup-gradle@v4

    #     - name: Jalankan test server
    #       run: ./gradlew :server:test --no-daemon

    # -------------------------------------------------------------------------
    # 2) Uji web (vitest). Beda dari test server di atas, job ini tak butuh service
    #    apa pun dan selesai dalam hitungan detik — jadi ia LAYAK jadi gerbang deploy.
    # -------------------------------------------------------------------------
    web-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: web/package-lock.json

            - run: npm ci
              working-directory: web

            - run: npm run lint
              working-directory: web

            - run: npm test
              working-directory: web

    # -------------------------------------------------------------------------
    # 3) Build kedua image lalu dorong ke GitHub Container Registry.
    # -------------------------------------------------------------------------
    build-and-push:
        # `test` server sementara dinonaktifkan (dikomentari di atas) — jangan
        # `needs: test`, kalau tidak GitHub menolak workflow-nya. Uji web ikut jadi
        # gerbang: image tak dibangun kalau konsolnya sendiri sudah gagal diuji.
        needs: web-test
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - name: Login ke GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build & push ftth-server
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: server/Dockerfile
                  push: true
                  tags: |
                      ${{ env.IMAGE_PREFIX }}/ftth-server:latest
                      ${{ env.IMAGE_PREFIX }}/ftth-server:${{ github.sha }}
                  # Matikan attestation provenance/SBOM: manifest attestation-nya memicu
                  # 403 saat push blob ke GHCR pada tag kedua (git-sha), dan tak diperlukan
                  # untuk pipeline deploy privat ini.
                  provenance: false
                  sbom: false
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Build & push ftth-web
              uses: docker/build-push-action@v6
              with:
                  context: ./web
                  file: web/Dockerfile
                  push: true
                  tags: |
                      ${{ env.IMAGE_PREFIX }}/ftth-web:latest
                      ${{ env.IMAGE_PREFIX }}/ftth-web:${{ github.sha }}
                  provenance: false
                  sbom: false
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            # GenieACS (ACS TR-069 untuk modul `cpe`). Isinya cuma `npm i -g
            # genieacs@<versi pin>`, jadi tak berubah tiap commit — tetap ikut
            # didorong supaya VPS cukup `pull` seperti image lain (tak perlu build
            # di sana, dan versinya dikunci repo, bukan image pihak ketiga).
            - name: Build & push ftth-genieacs
              uses: docker/build-push-action@v6
              with:
                  context: ./docker/genieacs
                  file: docker/genieacs/Dockerfile
                  push: true
                  tags: |
                      ${{ env.IMAGE_PREFIX }}/ftth-genieacs:latest
                      ${{ env.IMAGE_PREFIX }}/ftth-genieacs:${{ github.sha }}
                  provenance: false
                  sbom: false
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    # -------------------------------------------------------------------------
    # 4) SSH ke VPS: tarik image terbaru lalu naikkan ulang stack.
    # -------------------------------------------------------------------------
    deploy:
        needs: build-and-push
        runs-on: ubuntu-latest
        steps:
            - name: Ambil konfigurasi deploy
              uses: actions/checkout@v4

            - name: Install cloudflared
              run: |
                  curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
                  sudo dpkg -i cloudflared.deb
                  rm -f cloudflared.deb

            - name: Konfigurasi SSH & Cloudflare Access
              env:
                  VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
                  VPS_HOST: ${{ secrets.VPS_HOST }}
                  VPS_USER: ${{ secrets.VPS_USER }}
              run: |
                  mkdir -p ~/.ssh
                  chmod 700 ~/.ssh
                  printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_rsa
                  chmod 600 ~/.ssh/id_rsa
                  cat << 'EOF' > ~/.ssh/config
                  Host ${{ secrets.VPS_HOST }}
                      ProxyCommand cloudflared access ssh --hostname %h
                      User ${{ secrets.VPS_USER }}
                      IdentityFile ~/.ssh/id_rsa
                      StrictHostKeyChecking no
                      UserKnownHostsFile /dev/null
                  EOF
                  chmod 600 ~/.ssh/config

            - name: Sinkronkan Docker Compose ke VPS
              run: |
                  ssh ${{ secrets.VPS_HOST }} "mkdir -p /opt/ftth"
                  scp deploy/docker-compose.prod.yml deploy/Caddyfile ${{ secrets.VPS_HOST }}:/opt/ftth/
                  scp -r deploy/postgres-init deploy/radius deploy/backup deploy/monitoring ${{ secrets.VPS_HOST }}:/opt/ftth/

            - name: Deploy lewat SSH
              env:
                  GHCR_PAT: ${{ secrets.GHCR_PAT }}
                  GHCR_USER: ${{ secrets.GHCR_USER }}
                  COMMIT_SHA: ${{ github.sha }}
              run: |
                  ssh ${{ secrets.VPS_HOST }} "GHCR_PAT='$GHCR_PAT' GHCR_USER='$GHCR_USER' COMMIT_SHA='$COMMIT_SHA' bash -s" << 'EOF'
                  set -eu
                  cd /opt/ftth
                  echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
                  if grep -q '^IMAGE_TAG=' .env; then
                      sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$COMMIT_SHA/" .env
                  else
                      echo "IMAGE_TAG=$COMMIT_SHA" >> .env
                  fi
                  docker compose -f docker-compose.prod.yml config --quiet
                  docker compose -f docker-compose.prod.yml pull
                  docker compose -f docker-compose.prod.yml up -d --remove-orphans
                  docker compose -f docker-compose.prod.yml ps
                  docker image prune -f
                  EOF

            - name: Verifikasi situs produksi
              run: |
                  curl --fail --silent --show-error \
                    --retry 24 --retry-delay 5 --retry-all-errors \
                    https://ftth.karuhundeveloper.com/ > /dev/null
