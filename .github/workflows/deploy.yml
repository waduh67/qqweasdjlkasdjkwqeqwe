name: mini-pc-access-diagnostic

on:
  push:
    branches: [work/minipc-cicd-20261001]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install cloudflared
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/cloudflare/cloudflared/releases/download/2026.9.1/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb
          rm cloudflared.deb
      - name: Configure the existing deployment identity
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/ftth-deploy
          ssh-keygen -y -f ~/.ssh/ftth-deploy >/dev/null
          printf '%s\n' 'ssh67.karuhundeveloper.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGscS7giMxy4EY1cyeYRqHs9UXtn6aPJ7hdazpH2MNPu' > ~/.ssh/known_hosts
      - name: Authorize the workspace key and inspect the mini PC
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/ftth-deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            -o 'ProxyCommand=cloudflared access ssh --hostname %h' \
            hidupjokowi@ssh67.karuhundeveloper.com 'bash -s' <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = hidupjokowi
          umask 077
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          key='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIClHE6Bxwg7PTpdFRImt03CUSo6It9ibeuzvTzr/Hl/l bayurifkialgh@gmail.com'
          touch ~/.ssh/authorized_keys
          if ! grep -qF "$key" ~/.ssh/authorized_keys; then
            printf '%s\n' "$key" >> ~/.ssh/authorized_keys
          fi
          chmod 600 ~/.ssh/authorized_keys
          printf 'Workspace SSH public key authorized\n'
          id
          uname -m
          uptime
          df -h /
          free -h
          if sudo -n true 2>/dev/null; then printf 'sudo-passwordless=yes\n'; else printf 'sudo-passwordless=no\n'; fi
          if command -v docker >/dev/null; then
            docker version --format '{{.Server.Version}}'
            docker compose version
            docker ps --format '{{.Names}} {{.Image}} {{.Status}} {{.Ports}}'
          fi
          if test -d /opt/ftth; then
            ls -ld /opt/ftth /opt/ftth/releases
            for file in .env docker-compose.prod.yml ftth-compose docker-compose.images.json docker-compose.shared-proxy.yml; do
              if test -r "/opt/ftth/$file"; then printf '%s readable\n' "$file"; fi
            done
          fi
          REMOTE
      - name: Pull the already verified migration rehearsal image
        env:
          GHCR_PAT: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          [[ "$GHCR_USER" =~ ^[A-Za-z0-9_-]+$ ]]
          printf '%s\n' "$GHCR_PAT" | ssh -i ~/.ssh/ftth-deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o 'ProxyCommand=cloudflared access ssh --hostname %h' hidupjokowi@ssh67.karuhundeveloper.com "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh -i ~/.ssh/ftth-deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o 'ProxyCommand=cloudflared access ssh --hostname %h' hidupjokowi@ssh67.karuhundeveloper.com 'docker pull ghcr.io/waduh67/ftth-server@sha256:a36872933f7baaa9bbe9136391468702623abe48d7db93ed8825f6168985ce4e'
      - name: Remove temporary deployment identity
        if: always()
        run: rm -f ~/.ssh/ftth-deploy
