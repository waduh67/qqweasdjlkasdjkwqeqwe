name: mobile-materials

on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'build-logic/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - '.github/workflows/mobile-materials.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: mobile-materials-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the technician APK and check shared behavior
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :mobile:android:assembleDebug :mobile:data:jvmTest :mobile:domain:jvmTest :mobile:app:jvmTest verifyMobileModuleGraph \
            -Pftth.android=true --no-daemon --no-parallel --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process --console=plain \
            2>&1 | tee mobile-technician-android.log
          test -s mobile/android/build/outputs/apk/debug/android-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-technician-android-${{ github.sha }}
          path: |
            mobile-technician-android.log
            mobile/android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error
  ios-compile:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile the configured iOS application targets
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :mobile:app:compileKotlinIosArm64 :mobile:app:compileKotlinIosSimulatorArm64 verifyMobileModuleGraph \
            --no-daemon --no-parallel --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process --console=plain \
            2>&1 | tee mobile-materials-native.log
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          log = Path('mobile-materials-native.log').read_text()
          tasks = ['compileKotlinIosArm64', 'compileKotlinIosSimulatorArm64']
          results = {}
          for task in tasks:
              matches = re.findall(r'^> Task :mobile:app:' + task + r'(.*)$', log, re.M)
              if len(matches) != 1 or any(word in matches[0] for word in ['SKIPPED', 'NO-SOURCE', 'FAILED']):
                  raise SystemExit('Required iOS compilation did not execute: ' + task)
              results[task] = matches[0].strip() or 'COMPILED'
          if 'BUILD SUCCESSFUL' not in log:
              raise SystemExit('Native compile did not complete successfully')
          Path('mobile-materials-native.json').write_text(json.dumps({
              'commit': os.environ['GITHUB_SHA'], 'runner': 'macos-latest',
              'tasks': results, 'nativeRuntimeOrRelease': False
          }, indent=2) + '\n')
          PY
      - name: Generate the iOS host project
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate --spec mobile/ios/project.yml
      - name: Link the Swift host for device and simulator
        shell: bash
        run: |
          set -euo pipefail
          for platform in 'generic/platform=iOS' 'generic/platform=iOS Simulator'; do
            xcodebuild -project mobile/ios/FTTHTechnician.xcodeproj -scheme FTTHTechnician \
              -configuration Debug -destination "$platform" CODE_SIGNING_ALLOWED=NO build \
              2>&1 | tee -a mobile-technician-ios-host.log
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-materials-native-${{ github.sha }}
          path: |
            mobile-materials-native.log
            mobile-materials-native.json
            mobile-technician-ios-host.log
          if-no-files-found: error
