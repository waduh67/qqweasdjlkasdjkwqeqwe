# ============================================================================
# Stack LAB LENGKAP di Docker — postgres + minio + server + web + caddy +
# radius-db (BRAS/RADIUS). Semua dibangun/dijalankan di Docker, tak perlu
# Gradle/npm/Postgres lokal. Untuk mencoba end-to-end (termasuk lab BNG) tanpa pusing.
#
#   docker compose -f docker-compose.lab.yml up -d --build
#   # buka http://localhost:8080  → login admin@demo.ftth / admin12345
#
# Secret memakai DEFAULT DEV dari server/application.yml (jwt/encryption/admin/S3),
# jadi TIDAK ada nilai sensitif di file ini. JANGAN dipakai untuk produksi.
#
# Project name terpisah (`ftth-lab`) agar volume/kontainer tidak bentrok dengan
# stack dev (docker-compose.yml) maupun prod. Port ke host hanya Caddy (8080).
# ============================================================================
name: ftth-lab

services:
  # --- Database aplikasi (PostGIS + TimescaleDB) — internal, tak diekspos ke host ---
  # Script init (dipakai ulang dari prod) membuat role app NON-superuser + database +
  # extension postgis/timescaledb. Superuser 'postgres' hanya untuk memasang extension;
  # app konek sebagai 'ftth' (NOSUPERUSER, NOBYPASSRLS) → RLS beneran menegakkan isolasi.
  postgres:
    image: timescale/timescaledb-ha:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      FTTH_DB_USER: ftth
      FTTH_DB_PASSWORD: ftth
      FTTH_DB_NAME: ftth
    volumes:
      - pgdata:/home/postgres/pgdata/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- Object storage bukti pengerjaan work order (internal) ---
  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ftth
      MINIO_ROOT_PASSWORD: ftthminio
    volumes:
      - miniodata:/data

  # --- Backend Spring Boot (dibangun dari server/Dockerfile) ---
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: ftth-server:lab
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      FTTH_DB_URL: jdbc:postgresql://postgres:5432/ftth
      FTTH_DB_USER: ftth
      FTTH_DB_PASSWORD: ftth
      FTTH_S3_ENDPOINT: http://minio:9000
      FTTH_S3_ACCESS_KEY: ftth
      FTTH_S3_SECRET_KEY: ftthminio
      FTTH_CORS_ORIGINS: http://localhost:8080
      # Seed tenant demo → login tenant admin: admin@demo.ftth / admin12345.
      # Platform admin (lintas tenant): root@ftth.local / rootadmin123.
      FTTH_SEED_DEMO: "true"
      # jwt-secret / encryption-secret sengaja tidak di-set → pakai default dev.

  # --- Frontend SPA (dibangun dari web/Dockerfile, disajikan Nginx) ---
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: ftth-web:lab
    restart: unless-stopped

  # --- Reverse proxy: satu pintu di http://localhost:8080 (/api → server, sisanya → web) ---
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - server
      - web
    environment:
      # ":80" = HTTP saja (tanpa TLS) — cocok untuk lab lokal.
      FTTH_SITE_ADDRESS: ":80"
    ports:
      - "8080:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # --- Lab BRAS/RADIUS: Postgres berisi skema FreeRADIUS + 1 sesi contoh hidup ---
  # Adapter FreeRADIUS collector membaca radacct lewat JDBC ke sini. Dari dalam
  # jaringan compose alamatnya `radius-db:5432` (bukan localhost:5433).
  radius-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: radius
      POSTGRES_USER: radius
      POSTGRES_PASSWORD: radius
    volumes:
      - radius_db:/var/lib/postgresql/data
      - ./docker/radius/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radius"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- Server FreeRADIUS (OPSIONAL) — hanya untuk uji DAE/CoA dengan BRAS nyata ---
  #   docker compose -f docker-compose.lab.yml --profile freeradius up -d freeradius
  freeradius:
    image: freeradius/freeradius-server:3.2.5
    profiles: ["freeradius"]
    depends_on:
      radius-db:
        condition: service_healthy
    volumes:
      - ./docker/radius/freeradius/mods-enabled/sql:/etc/freeradius/mods-enabled/sql:ro
      - ./docker/radius/freeradius/clients.conf:/etc/freeradius/clients.conf:ro
    command: ["radiusd", "-X"]
    restart: unless-stopped

  # --- Collector (OPSIONAL) — start SETELAH dapat API key dari UI ---
  # 1) buka app, buat "collector" → salin API key.
  # 2) FTTH_COLLECTOR_KEY=<key> docker compose -f docker-compose.lab.yml --profile collector up -d collector
  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    image: ftth-collector:lab
    profiles: ["collector"]
    depends_on:
      server:
        condition: service_started
      radius-db:
        condition: service_healthy
    environment:
      FTTH_SERVER_URL: http://server:8080
      # Isi via env saat start: FTTH_COLLECTOR_KEY=xxx docker compose ... up collector
      # Kosong → container keluar dengan pesan "FTTH_COLLECTOR_KEY belum diisi" (lihat log).
      FTTH_COLLECTOR_KEY: ${FTTH_COLLECTOR_KEY:-}
      FTTH_COLLECTOR_SIMULATOR: "false"
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  radius_db:
  caddy_data:
  caddy_config:
