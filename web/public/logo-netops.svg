<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 228 48" width="228" height="48" role="img" aria-label="NetOps Console">
  <!--
    Kunci merek horizontal: tile + wordmark. Dipakai di README, dokumen, dan email.

    Wordmark memakai dua <tspan> dalam SATU <text>, bukan dua <text> dengan koordinat
    sendiri: lebar huruf berbeda di tiap mesin (tumpukan font-nya berjenjang), dan
    tspan yang mengalir tetap rapat berapa pun font yang akhirnya dipakai. Dua <text>
    ber-x tetap akan tumpang-tindih atau menganga di mesin yang fontnya beda.
  -->
  <defs>
    <linearGradient id="netops-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2899f5"/>
      <stop offset="1" stop-color="#0078d4"/>
    </linearGradient>
  </defs>
  <g transform="translate(0 4)">
    <rect width="40" height="40" rx="8.75" fill="url(#netops-tile)"/>
    <g transform="scale(1.25)">
      <g fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="7.6" cy="16" r="2.9"/>
        <path d="M11.7 16H22.8"/>
        <path d="M16.8 16v-5a3 3 0 0 1 3-3h3"/>
        <path d="M16.8 16v5a3 3 0 0 0 3 3h3"/>
      </g>
      <g fill="#ffffff">
        <circle cx="25.6" cy="8" r="2.6"/>
        <circle cx="25.6" cy="16" r="2.6"/>
        <circle cx="25.6" cy="24" r="2.6"/>
      </g>
    </g>
  </g>
  <text x="54" y="32" font-size="23" letter-spacing="-0.4"
        font-family="'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,system-ui,'Helvetica Neue',Arial,sans-serif">
    <!-- Jarak antar-kata lewat `dx`, bukan spasi harfiah: XML meringkas spasi di batas
         tspan sehingga wordmark-nya menempel jadi "NetOpsConsole". -->
    <tspan font-weight="700" fill="#1b1a19">NetOps</tspan><tspan dx="7" font-weight="400" fill="#605e5c">Console</tspan>
  </text>
</svg>
