<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="NetOps Console">
  <!--
    Lambang NetOps Console: satu feeder (cincin) memecah lewat splitter menjadi tiga
    drop (simpul padat) — topologi PON yang persis dikelola aplikasi ini.

    Tikungannya membulat, bukan siku, karena serat optik punya radius tekuk minimum:
    detail kecil yang membuat lambang ini benar, bukan sekadar "gambar jaringan".

    Semua geometri di grid 32×32 dengan stroke 2.4 supaya ketiga cabangnya tetap
    terpisah di favicon 16px — ukuran paling kejam yang harus dilewati sebuah logo.
  -->
  <defs>
    <linearGradient id="netops-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2899f5"/>
      <stop offset="1" stop-color="#0078d4"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#netops-tile)"/>
  <g fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7.6" cy="16" r="2.9"/>
    <path d="M11.7 16H22.8"/>
    <path d="M16.8 16v-5a3 3 0 0 1 3-3h3"/>
    <path d="M16.8 16v5a3 3 0 0 0 3 3h3"/>
  </g>
  <g fill="#ffffff">
    <circle cx="25.6" cy="8" r="2.6"/>
    <circle cx="25.6" cy="16" r="2.6"/>
    <circle cx="25.6" cy="24" r="2.6"/>
  </g>
</svg>
