# SPA: setiap rute yang bukan file fisik dilempar ke index.html supaya React
# Router menangani navigasi di sisi klien. Endpoint /api TIDAK dilayani di sini —
# Caddy (reverse proxy di depan) yang meneruskannya ke ftth-server.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /actuator/health/readiness {
        resolver 127.0.0.11 valid=10s;
        set $backend http://server:8080;
        proxy_pass $backend/actuator/health/readiness;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
        add_header Cache-Control "no-store" always;
    }

    # Aset ber-hash dari Vite (immutable) boleh di-cache lama.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
